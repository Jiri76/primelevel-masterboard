<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inbox Report — Masterboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* Same design tokens as the rest of Masterboard. PRIVATE PAGE: the reports
     contain email content, so they live in private Supabase tables and are
     only readable after signing in with an allowed address (see
     email_report_viewers). Nothing is shown to a signed-out visitor. */
  :root {
    --navy: #1E2633;
    --white: #F9F9FA;
    --gold: #B29B68;
    --input-bg: #2A3441;
    --placeholder: #8A93A3;
    --border: #3A4453;
    --red: #E45858;
    --orange: #D9A441;
    --green: #4CAF7D;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy);
    font-family: 'Montserrat', sans-serif;
    min-height: 100%;
  }
  .container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 87px 20px 100px; /* top: measured live -- 90px overshot to 103px by eye, 87px lands the "Inbox Report" letters exactly 100px from the page top */
  }
  h1 {
    color: var(--gold);
    font-weight: 700;
    font-size: 60px;
    margin: 0 0 85px;
    text-align: center;
  }

  /* Date buttons: identical to Insider Edge's report tiles. Pinned to the
     left on wide screens, a centered row below 1728px. */
  .report-tiles {
    position: fixed;
    top: 48px;
    left: 40px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 200px;
  }
  .report-tile {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 50px;
    width: 200px;
    background: var(--input-bg);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 0 18px;
    color: var(--white);
    font-weight: 700;
    font-size: 18px;
    font-family: 'Montserrat', sans-serif;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .report-tile:hover,
  .report-tile.selected {
    border-color: var(--white);
    transform: scale(1.025);
  }
  .report-tile.failed {
    color: var(--red);
  }

  /* Sign-in card (shown only while signed out). */
  .signin {
    max-width: 520px;
    margin: 0 auto;
    background: var(--white);
    color: var(--navy);
    padding: 50px 40px;
  }
  .signin h2 {
    margin: 0 0 12px;
    font-size: 25px;
  }
  .signin p {
    margin: 0 0 24px;
    font-size: 15px;
    line-height: 24px;
  }
  .signin label {
    display: block;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .signin input {
    width: 100%;
    height: 50px;
    padding: 0 16px;
    font-size: 16px;
    font-family: 'Montserrat', sans-serif;
    color: var(--white);
    background: var(--input-bg);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .signin input:focus-visible,
  .signin button:focus-visible,
  .signout:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  .signin button {
    width: 100%;
    height: 50px;
    font-size: 18px;
    font-weight: 700;
    font-family: 'Montserrat', sans-serif;
    color: var(--navy);
    background: var(--gold);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  .signin button:disabled {
    opacity: 0.55;
    cursor: default;
  }
  .signin .message {
    margin: 16px 0 0;
    font-size: 15px;
    line-height: 24px;
  }
  .signin .message.error {
    color: #b33a3a;
  }

  .report-content {
    width: 100%;
    background: var(--white);
    color: var(--navy);
    overflow: hidden;
  }
  .report-header-band {
    background: var(--input-bg);
    padding: 60px 40px;
    text-align: center;
  }
  .report-content-title {
    margin: 0 0 3px;
    font-weight: 700;
    font-size: 35px;
    color: var(--gold);
  }
  .report-content-date {
    color: var(--gold);
    opacity: 0.6;
    font-size: 15px;
    font-weight: 700;
  }
  .report-body {
    font-size: 15px;
    line-height: 24px;
    padding: 60px 70px 70px;
  }
  .report-body h3 {
    font-size: 25px;
    font-weight: 700;
    margin: 60px 0 30px;
    padding-bottom: 4px;
    border-bottom: 2px solid var(--navy);
  }
  .report-body h3:first-child {
    margin-top: 0;
  }
  .report-body p {
    margin: 0 0 30px;
  }
  .report-body ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .report-body li {
    margin: 0 0 18px;
    padding: 0;
  }
  .report-body ul ul {
    margin: 6px 0 0 20px;
  }
  .report-body ul ul li {
    margin-bottom: 6px;
  }
  /* ---- Scannable layout: at-a-glance table + one card per email ---- */
  .badge {
    display: inline-block;
    padding: 2px 10px;
    margin: 0 4px 4px 0;
    border: 1px solid transparent;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    line-height: 20px;
    white-space: nowrap;
  }
  .badge.high { background: var(--red); color: #fff; }
  .badge.medium { background: var(--gold); color: var(--navy); }
  .badge.low { background: #dfe3ea; color: var(--navy); }
  .badge.spam { background: #c9ced8; color: #4b5565; }
  .badge.worry-yes { background: #fff; color: #b3261e; border-color: #b3261e; }
  .badge.worry-watch { background: #fff; color: #8a5a00; border-color: var(--orange); }
  .badge.worry-no { background: #fff; color: #23694a; border-color: var(--green); }
  .badge.cat { background: var(--input-bg); color: var(--white); }
  .badge.draft { background: #eef1f5; color: var(--navy); border-color: var(--border); }
  .report-body table.scan {
    width: 100%;
    margin: 0 0 30px;
    border-collapse: collapse;
    font-size: 14px;
    line-height: 20px;
  }
  .report-body table.scan th {
    padding: 8px 10px;
    text-align: left;
    font-size: 13px;
    border-bottom: 2px solid var(--navy);
  }
  .report-body table.scan td {
    padding: 10px;
    vertical-align: top;
    border-bottom: 1px solid #dfe3ea;
  }
  .report-body li.entry {
    margin: 0 0 24px;
    padding: 16px 18px 6px;
    border: 1px solid #dfe3ea;
    border-left: 6px solid #c9ced8;
    border-radius: 10px;
    background: #fff;
  }
  .report-body li.entry.high { border-left-color: var(--red); }
  .report-body li.entry.medium { border-left-color: var(--gold); }
  .report-body li.entry.low { border-left-color: #dfe3ea; }
  .report-body li.entry.spam { border-left-color: #c9ced8; opacity: 0.85; }
  .report-body li.entry p { margin: 0 0 10px; }
  .report-body li.entry p.from { font-size: 14px; color: #4b5565; }
  .report-body li.entry p.gist { font-size: 15px; }
  .report-body li.entry p.why { font-size: 14px; }
  .report-body details {
    margin: 0 0 12px;
  }
  .report-body summary {
    cursor: pointer;
    font-weight: 700;
  }
  .report-body summary:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  /* Quoted text: the original email and the drafted reply. */
  .report-body blockquote {
    margin: 8px 0 12px;
    padding: 12px 18px;
    border-left: 3px solid var(--gold);
    background: rgba(30, 38, 51, 0.06);
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .report-body a {
    color: var(--navy);
    font-weight: 700;
    text-decoration: underline;
  }
  .report-body a:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  .report-error {
    color: #b33a3a;
    font-weight: 700;
  }
  .empty-state {
    color: var(--placeholder);
    font-size: 20px;
    text-align: center;
    padding: 0 0 60px;
    width: 100%;
  }
  /* Same red already used for .report-error and the sign-in form's own
     error message elsewhere on this page -- one consistent "something's
     wrong" colour across the whole page, not a new one. */
  .empty-state.denied {
    color: #b33a3a;
    font-weight: 700; /* bold shifts the letters' own metrics slightly vs the regular-weight messages */
    padding-top: 2px; /* title baseline -> message letters = 100px by eye (measured 98px without this).
       padding, not margin -- an added margin-top here collapses against h1's
       own larger margin-bottom and has literally no visible effect; padding
       never collapses, so it's the only reliable way to nudge this. */
  }
  .signout {
    display: block;
    width: fit-content;
    margin: 31px auto 0; /* letters' baseline -> "Sign out" letters = 100px by eye. The .empty-state above already carries a 60px bottom padding, so only 31px more is needed here (measured live: 91px overshot to 160px). */
    background: none;
    border: 0;
    color: var(--gold); /* same colour as the "Inbox Report" title, per explicit request */
    font-family: 'Montserrat', sans-serif;
    font-size: 20px; /* matches .empty-state's size, per explicit request */
    font-weight: 700;
    text-decoration: none; /* per explicit request -- no underline */
    cursor: pointer;
  }

  @media (min-width: 1728px) {
    .empty-state { margin-top: -4px; }
  }
  @media (max-width: 1727px) {
    .report-tiles {
      position: static;
      width: auto;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      margin: 0 0 40px;
    }
    h1 { margin-bottom: 40px; }
  }
  @media (max-width: 720px) {
    h1 { font-size: 44px; }
    .report-tile {
      width: calc(50% - 8px);
      padding: 0 8px;
      font-size: 15px;
    }
    .signin { padding: 36px 24px; }
    .report-header-band { padding: 40px 24px; }
    .report-content-title { font-size: 26px; }
    .report-body { padding: 40px 24px 50px; }
    /* Phones: each summary row becomes a compact stacked line (badges, then the
       sentence, then the draft status) instead of a cramped 4-column table. */
    .report-body table.scan,
    .report-body table.scan tbody { display: block; }
    .report-body table.scan thead { display: none; }
    .report-body table.scan tr {
      display: block;
      padding: 10px 0;
      border-bottom: 1px solid #dfe3ea;
    }
    .report-body table.scan td {
      display: inline-block;
      padding: 0 6px 4px 0;
      border: 0;
    }
    .report-body table.scan td:nth-child(3) {
      display: block;
      padding: 2px 0 4px;
    }
    .report-body table.scan td:nth-child(4)::before {
      content: 'Draft: ';
      color: #4b5565;
    }
  }
  @media (max-width: 359px) {
    h1 { font-size: 38px; }
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Inbox Report</h1>
    <div class="report-tiles" id="reportTiles"></div>
    <div id="content"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    import DOMPurify from 'https://esm.sh/dompurify@3.1.6';

    const SUPABASE_URL = 'https://kenlhcatkjthhzuaznpg.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_-gt5PPGL45s3hRsfOosH6g_q3yP-b-_';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const tilesEl = document.getElementById('reportTiles');
    const contentEl = document.getElementById('content');

    // ---- Sanitising ---------------------------------------------------
    // The report text is written by an AI agent FROM EMAIL CONTENT, which
    // anyone in the world can influence. So it is never trusted: only a few
    // plain tags survive, links are limited to opening a Gmail thread, and
    // inline style may only set a text colour (the red flags).
    const GMAIL_LINK = /^https:\/\/mail\.google\.com\//;
    const COLOUR_ONLY = /^\s*color:\s*#[0-9a-f]{3,8}\s*;?\s*$/i;
    // Only these style classes are honoured (defined in this page's CSS).
    const CLASS_WHITELIST = new Set(['badge', 'high', 'medium', 'low', 'spam', 'worry-yes', 'worry-watch', 'worry-no', 'cat', 'draft', 'entry', 'head', 'from', 'gist', 'why', 'scan']);
    DOMPurify.addHook('afterSanitizeAttributes', (node) => {
      if (node.hasAttribute('class')) {
        const kept = node.getAttribute('class').split(/\s+/).filter((c) => CLASS_WHITELIST.has(c));
        if (kept.length) node.setAttribute('class', kept.join(' '));
        else node.removeAttribute('class');
      }
      if (node.hasAttribute('style') && !COLOUR_ONLY.test(node.getAttribute('style'))) {
        node.removeAttribute('style');
      }
      if (node.tagName === 'A') {
        if (!GMAIL_LINK.test(node.getAttribute('href') || '')) {
          node.removeAttribute('href');
        } else {
          node.setAttribute('target', '_blank');
          node.setAttribute('rel', 'noopener noreferrer');
        }
      }
    });
    function cleanReportHtml(html) {
      return DOMPurify.sanitize(html || '', {
        ALLOWED_TAGS: ['h3', 'h4', 'p', 'ul', 'ol', 'li', 'blockquote', 'strong', 'em', 'b', 'i', 'br', 'span', 'a', 'table', 'thead', 'tbody', 'tr', 'th', 'td', 'details', 'summary'],
        ALLOWED_ATTR: ['style', 'href', 'target', 'rel', 'class', 'open'],
      });
    }

    // ---- Small helpers --------------------------------------------------
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function formatDate(value) {
      return new Date(value).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }
    function formatDateTime(value) {
      return new Date(value).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    }

    // ---- Signed-out view ------------------------------------------------
    function showSignIn() {
      tilesEl.replaceChildren();
      const box = el('div', 'signin');
      box.append(el('h2', '', 'Sign in'));
      box.append(el('p', '', 'This page shows your daily inbox report, so it is private. Enter your email address and we will send you a one-time login link.'));
      const form = document.createElement('form');
      const label = el('label', '', 'Email address');
      label.htmlFor = 'signInEmail';
      const input = document.createElement('input');
      input.type = 'email';
      input.id = 'signInEmail';
      input.name = 'email';
      input.autocomplete = 'email';
      input.required = true;
      const button = el('button', '', 'Send me a login link');
      button.type = 'submit';
      const message = el('p', 'message');
      message.setAttribute('aria-live', 'polite');
      form.append(label, input, button, message);
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        message.className = 'message';
        message.textContent = 'Sending…';
        // shouldCreateUser: false -- this page only ever signs in people who
        // already exist. This Supabase project is shared with the customer
        // app, where a trigger turns every NEW user into an app customer
        // account; without this, a stranger typing any address here would
        // create a junk customer. Unknown addresses are refused by Supabase
        // (422, error_code "otp_disabled", verified 2026-09-26) and nothing
        // is created. The page answers both cases with the same neutral
        // message, so it never reveals which addresses exist.
        const { error } = await supabase.auth.signInWithOtp({
          email: input.value.trim(),
          options: {
            emailRedirectTo: window.location.origin + window.location.pathname,
            shouldCreateUser: false,
          },
        });
        const neutral = 'If this address is allowed to open the Inbox Report, a sign-in link is on its way. Check your inbox (and spam folder), then tap the link. It brings you straight back here.';
        if (!error || error.code === 'otp_disabled' || /signups not allowed/i.test(error.message || '')) {
          message.textContent = neutral;
        } else if (error.status === 429) {
          message.className = 'message error';
          message.textContent = 'Too many sign-in requests. Please wait a minute and try again.';
          button.disabled = false;
        } else {
          console.error('Could not send the sign-in link:', error);
          message.className = 'message error';
          message.textContent = 'Could not send the link right now. Please try again in a moment.';
          button.disabled = false;
        }
      });
      box.append(form);
      contentEl.replaceChildren(box);
    }

    // ---- Signed-in view -------------------------------------------------
    function renderReport(report) {
      const card = el('div', 'report-content');
      const band = el('div', 'report-header-band');
      band.append(el('div', 'report-content-title', report.title));
      band.append(el('div', 'report-content-date', `Generated ${formatDateTime(report.created_at)}`));
      const body = el('div', 'report-body');
      if (report.status === 'failed') {
        body.append(el('p', 'report-error', 'This run failed, so there is no report for this day.'));
        body.append(el('p', '', report.error_text || 'No error details were recorded.'));
      } else {
        body.innerHTML = cleanReportHtml(report.html_content);
      }
      card.append(band, body);
      contentEl.replaceChildren(card);
      alignTiles();
    }

    // The tiles are position:fixed on wide screens, so put them on the same
    // line as the top of the report card (scroll-independent).
    function alignTiles() {
      if (getComputedStyle(tilesEl).position !== 'fixed') return;
      const target = contentEl.firstElementChild;
      if (!target) return;
      tilesEl.style.top = `${Math.round(target.getBoundingClientRect().top + window.scrollY)}px`;
    }
    window.addEventListener('resize', alignTiles);

    function renderTiles(reports, selectedId) {
      tilesEl.replaceChildren();
      for (const report of reports) {
        const tile = el('button', 'report-tile', formatDate(report.run_date || report.created_at));
        tile.type = 'button';
        if (report.status === 'failed') tile.classList.add('failed');
        if (report.id === selectedId) tile.classList.add('selected');
        tile.addEventListener('click', () => {
          renderTiles(reports, report.id);
          renderReport(report);
        });
        tilesEl.append(tile);
      }
    }

    async function showReports() {
      contentEl.replaceChildren();
      tilesEl.replaceChildren();

      // Check access FIRST, before ever querying the reports table itself --
      // a signed-in visitor who isn't on the approved list is told so
      // plainly and immediately (per explicit request: they already proved
      // they own that exact address by clicking a real emailed link, so
      // naming it back to them reveals nothing new). is_email_report_viewer()
      // runs the exact same check the table's own RLS policy uses, so this
      // can never disagree with what the table itself would allow.
      const { data: { user } } = await supabase.auth.getUser();
      const { data: allowed, error: authError } = await supabase.rpc('is_email_report_viewer');

      if (authError) {
        console.error('Could not check report access:', authError);
        contentEl.append(el('div', 'empty-state', 'Could not load your reports right now. Please try again in a moment.'));
      } else if (!allowed) {
        contentEl.append(el('div', 'empty-state denied', `${user?.email || 'This account'} does not have access to this report.`));
      } else {
        const { data, error } = await supabase
          .from('email_reports')
          .select('id, created_at, run_date, status, title, html_content, error_text')
          .order('created_at', { ascending: false })
          .limit(30);
        if (error) {
          // A clean, plain-English message for the reader -- the real
          // technical detail (table/column names, the raw Postgres error) is
          // still logged to the console for whoever is debugging, never
          // shown on the page.
          console.error('Could not load email_reports:', error);
          contentEl.append(el('div', 'empty-state', 'Could not load your reports right now. Please try again in a moment.'));
        } else if (!data.length) {
          contentEl.append(el('div', 'empty-state', 'No reports to show yet. The first one appears after the agent’s 08:00 run.'));
        } else {
          renderTiles(data, data[0].id);
          renderReport(data[0]);
        }
      }
      const out = el('button', 'signout', 'Sign out');
      out.type = 'button';
      out.addEventListener('click', () => supabase.auth.signOut());
      contentEl.append(out);
    }

    // ---- Routing on sign-in state ---------------------------------------
    let shown = null;
    async function route(session) {
      const mode = session ? 'reports' : 'signin';
      if (mode === shown) return;
      shown = mode;
      if (mode === 'reports') {
        // The login link comes back with tokens in the address: tidy it.
        if (window.location.hash.includes('access_token')) history.replaceState(null, '', window.location.pathname);
        await showReports();
      } else {
        showSignIn();
      }
    }
    supabase.auth.onAuthStateChange((_event, session) => { route(session); });
    const { data: { session } } = await supabase.auth.getSession();
    route(session);
  </script>
</body>
</html>
