<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Tap test</title>
<!-- A throwaway test page (owner, 2026-10-06): does the PAGE hear a tap on
     the spot beside Safari's address pill, just above the keyboard? Shows
     every tap the page receives. No data, no sign-in, nothing saved.
     Delete it once the test is done. -->
<style>
  body { margin: 0; background: #1E2633; color: #F9F9FA; font-family: -apple-system, Arial, sans-serif; min-height: 140vh; }
  #log { position: fixed; top: 0; left: 0; right: 0; z-index: 5; background: #2A3441; padding: 14px 16px; font-size: 16px; line-height: 1.45; min-height: 150px; }
  #log b { color: #B29B68; }
  main { padding: 210px 20px 40px; }
  input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; border-radius: 10px; border: 1px solid #F9F9FA; background: #2A3441; color: #F9F9FA; }
  p { color: #8A93A3; font-size: 16px; }
</style>
</head>
<body>
<div id="log"><b>Tap test, version 2</b><br>1. Tap the box below, then tap HIGH UP on the empty page.<br>2. Tap the box again, then tap the spot beside the address pill.<br>Each tap shows here as one line.</div>
<main>
  <input id="field" placeholder="Tap here first" />
  <p>Then tap the empty spot beside the address pill above the keyboard, the same place as your red cross.</p>
</main>
<script>
  const log = document.getElementById('log');
  const lines = [];
  function add(text) {
    lines.unshift(new Date().toLocaleTimeString('en-GB') + '  ' + text);
    lines.length = Math.min(lines.length, 5);
    log.innerHTML = '<b>The page heard:</b><br>' + lines.join('<br>');
  }
  // Version 2: every signal of ONE tap on ONE line, in the order they came
  // (finger down / finger up / "taken over" / mouse press / click), so the
  // blue spot and the red spot can be compared signal by signal.
  let tap = null, timer = null;
  function note(name, y) {
    if (!tap) tap = { y: y, names: [] };
    if (name === 'touchmove' && tap.names.includes('touchmove')) return;
    tap.names.push(name);
    clearTimeout(timer);
    timer = setTimeout(() => {
      const ends = Math.round(window.visualViewport ? window.visualViewport.height : window.innerHeight);
      add(`tap at height ${Math.round(tap.y)} (screen ends ${ends}): ${tap.names.join(', ')}`);
      tap = null;
    }, 800);
  }
  const SIGNALS = ['touchstart', 'touchmove', 'touchend', 'touchcancel', 'pointerdown', 'pointerup', 'pointercancel', 'mousedown', 'click'];
  for (const type of SIGNALS) {
    document.addEventListener(type, (e) => {
      const t = e.changedTouches ? e.changedTouches[0] : e;
      note(type.replace('pointercancel', 'POINTERCANCEL').replace('touchcancel', 'TOUCHCANCEL'), t && t.clientY !== undefined ? t.clientY : -1);
    }, true);
  }
  document.getElementById('field').addEventListener('blur', () => note('box lost its cursor', -1));
</script>
</body>
</html>
