<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Masterboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* Copied verbatim from Renewals -- same tokens, not just similar
     colors, per explicit instruction. Every PrimeLevel tool shares this
     exact palette. */
  :root {
    --navy: #1E2633;
    --white: #F9F9FA;
    --gold: #B29B68;
    --input-bg: #2A3441;
    --placeholder: #8A93A3;
    --border: #3A4453;
    --green: #4CAF7D;
    --orange: #D9A441;
    --red: #E45858;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy);
    font-family: 'Montserrat', sans-serif;
    min-height: 100%;
  }
  /* Title is genuinely centered on the full page (this is a real
     page-width container, margin:0 auto). The tiles are pulled OUT of
     this flow entirely (see .tiles below, position:fixed) so the two
     can be independently positioned: tiles pinned to the left edge of
     the viewport, title centered on the whole screen -- these are no
     longer the same box, on purpose. */
  .container {
    max-width: 1040px;
    margin: 0 auto;
    padding: 100px 20px 80px;
  }
  h1 {
    color: var(--gold);
    font-weight: 700;
    font-size: 60px;
    margin: 0 0 100px;
    text-align: center;
  }

  /* Link tiles -- same card language as Renewals' item rows (input-bg,
     border, 10px radius), stacked vertically, each just a plain link
     out to its own existing tool. Pinned to the left edge of the
     viewport (left never changes), independent of .container so it
     doesn't move when the centered title resizes.
     `top: 48px` is a plain fixed value now, not JS-measured -- it used
     to be dynamically aligned to the first holding card's top edge
     (see the old alignTilesToCards() logic, removed), but the cards
     have moved to their own investments.html page (per explicit
     request), so there's nothing left on THIS page to align to.
     Structure-phase placeholder value -- revisit in the polish pass. */
  .tiles {
    position: fixed;
    top: 48px;
    left: 40px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 200px;
  }
  /* Fixed 50px height via flex-centering rather than padding, so the
     height is an exact pixel value regardless of font metrics -- not
     a side-effect of top/bottom padding that happens to add up close
     to 50px. */
  .tile {
    display: flex;
    align-items: center;
    height: 50px;
    background: var(--input-bg);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 0 18px;
    color: var(--white);
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    transition: border-color 0.15s ease;
  }
  .tile:hover {
    border-color: var(--white);
  }

  /* Placeholder for the (not-yet-built) main picture -- fixed 700x500,
     centered under the title, per explicit request: "just center it,
     we'll adjust it later with the spec." Click opens the native file
     picker (a hidden real <input type="file">, triggered programmatically
     -- the only reliable cross-browser way to make an arbitrary element
     act as an upload trigger); the chosen image previews inside the box
     immediately (object-fit:cover, session-only via createObjectURL --
     nothing persisted anywhere yet, this is just to SEE it working). */
  .image-placeholder {
    width: 700px;
    height: 500px;
    margin: 0 auto;
    background: var(--input-bg);
    border: 1px dashed var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
    position: relative;
  }
  .image-placeholder-label {
    color: var(--placeholder);
    font-size: 15px;
    text-align: center;
  }
  .image-placeholder img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  .image-placeholder.has-image .image-placeholder-label {
    display: none;
  }
  .image-placeholder.has-image img {
    display: block;
  }
</style>
</head>
<body>
  <div class="tiles" id="tiles"></div>

  <div class="container">
    <h1>Masterboard</h1>
    <div class="image-placeholder" id="imagePlaceholder">
      <span class="image-placeholder-label">Click to select a picture</span>
      <img id="imagePreview" alt="" />
      <input type="file" id="imageInput" accept="image/*" hidden />
    </div>
  </div>

  <script type="module">
    // ---- Link tiles -- add more tools here, nothing else to touch. ----
    // TODO: Insider Edge's real URL is a placeholder ("#") until confirmed.
    // Investments now points to its own page -- the 3 holding cards moved
    // there entirely (per explicit request), this page no longer has a
    // holdings section to anchor-scroll to.
    const TILES = [
      { label: 'Insider Edge', href: '#' },
      { label: 'Renewals', href: 'https://jiri76.github.io/primelevel-renewals/' },
      { label: 'Investments', href: 'investments.html' },
    ];

    const tilesEl = document.getElementById('tiles');

    function buildTile({ label, href }) {
      const a = document.createElement('a');
      a.className = 'tile';
      a.href = href;
      a.textContent = label;
      return a;
    }

    TILES.forEach((t) => tilesEl.append(buildTile(t)));

    // ---- Picture placeholder -- structure-phase only, per explicit
    // request ("just want to see it," real spec/persistence later).
    // Clicking the box triggers the real (hidden) file input -- the
    // standard, reliable way to make an arbitrary element act as an
    // upload trigger, since a plain <div> can't open a file picker on
    // its own. The chosen file is shown as a live preview via
    // createObjectURL -- session-only, nothing uploaded or saved
    // anywhere yet. ----
    const imagePlaceholder = document.getElementById('imagePlaceholder');
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');

    imagePlaceholder.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (!file) return;
      imagePreview.src = URL.createObjectURL(file);
      imagePlaceholder.classList.add('has-image');
    });
  </script>
</body>
</html>
