name: Keep Supabase awake

# Supabase's free tier auto-pauses a project after a period with no
# activity -- this is what caused the ~20 hour outage on 14 Sept 2026
# that silently blocked that week's Insider Edge report. This workflow
# does nothing but a single, tiny, read-only request once a day so the
# project always looks "recently active" and never gets the chance to
# pause. It reads one row from a public table using the same public
# anon key already embedded in insider-edge.html -- no write access,
# no ability to change or delete anything, identical in effect to a
# random visitor loading that page.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Poke Supabase to keep the project awake
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://kenlhcatkjthhzuaznpg.supabase.co/rest/v1/insider_edge_reports?select=id&limit=1" \
            -H "apikey: sb_publishable_-gt5PPGL45s3hRsfOosH6g_q3yP-b-_"
