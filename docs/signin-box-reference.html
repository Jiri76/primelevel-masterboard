<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-in box — LOCKED reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* PRIMELEVEL SIGN-IN BOX — LOCKED REFERENCE (owner, 2026-09-30; design v10).
     Full spec and the reasons behind every value: SIGNIN-BOX-STANDARD.md.
     Copy this exactly for every sign-in page ("create a sign-in page").
     The page around it here is the Inbox Report's layout (title 50px, the
     opening-page spacing), because the after-send line must sit exactly like
     an opening-page message. Do NOT change a value without the owner's
     explicit request. */
  :root {
    --navy: #1E2633;
    --white: #F9F9FA;
    --gold: #B29B68;
    --card: #E9E9EB; /* 7.5% navy mixed into white: 0.925 x #F9F9FA + 0.075 x #1E2633 per channel */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy);
    color: var(--navy); /* no browser-default black anywhere */
    font-family: 'Montserrat', sans-serif;
    min-height: 100%;
  }
  .container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 87px 20px 100px; /* "Inbox Report" letters 100px from the page top by eye */
  }
  h1 {
    color: var(--gold);
    font-weight: 700;
    font-size: 50px;
    line-height: 65px;
    margin: 0 0 85px;
    text-align: center;
  }
  .report-tiles { display: flex; } /* the live page's (empty) date-button row */

  /* ---- The card ---- By-eye rhythm: 60 at the card edges (30 on phones),
     30 between groups, 15 inside a group, 24 line pitch. CSS margins are
     smaller than the by-eye gaps because letters sit inside taller line
     boxes; every value was measured live. */
  .signin {
    max-width: 540px;
    margin: 0 auto;
    background: var(--card);
    color: var(--navy);
    border-radius: 10px;
    padding: 99px 60px 60px; /* ONE card size: top -> "Sign in" 102 by eye = button -> bottom (with the kept line slot); sides 60 */
    text-align: left;
  }
  .signin h2 {
    margin: 0 0 5px; /* "Sign in" -> intro letters = 15 */
    font-size: 20px;
    font-weight: 700;
  }
  .signin p {
    margin: 0 0 20px; /* intro -> "Email address" = 30 */
    font-size: 15px;
    line-height: 24px;
  }
  .signin label {
    display: block;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 11px; /* "Email address" -> field = 15 */
  }
  .signin input {
    width: 100%;
    height: 45px;
    padding: 0 16px; /* typed letters 16 above / 17 below by eye: the closest possible (odd 33px) */
    font-size: 16px; /* 16px: also stops iPhone Safari zooming in on tap */
    font-family: 'Montserrat', sans-serif;
    color: var(--navy);
    background: var(--white);
    border: 1px solid var(--navy);
    border-radius: 10px;
    margin-bottom: 15px; /* field -> button = 15 */
    text-align: left;
  }
  /* Focus in NAVY, not gold (owner, 2026-10-02): gold on the light card is
     only ~2.3:1 contrast (below the 3:1 a focus marker needs); navy is ~13:1
     and matches the box. Typing in the field: its navy border thickens
     1px -> 2px (a 1px shadow outside the 1px border, so nothing moves).
     Buttons, reached with the keyboard: a 2px navy ring. */
  .signin input:focus-visible {
    outline: none;
    box-shadow: 0 0 0 1px var(--navy);
  }
  .signin button:focus-visible {
    outline: 2px solid var(--navy);
    outline-offset: 2px;
  }
  .signin button {
    width: 100%;
    height: 45px;
    padding: 2px 0 0; /* button text centred by eye: 16 above, 16 below */
    font-size: 16px;
    font-weight: 700;
    font-family: 'Montserrat', sans-serif;
    color: var(--navy);
    background: var(--white); /* both buttons white: two equal choices, neither is gold */
    border: 1px solid var(--navy);
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }
  /* Hover + press: colour swap (owner's pick, 2026-09-30). Only the button moves. */
  .signin button:hover {
    background: var(--navy);
    color: var(--white);
    transform: scale(1.02);
  }
  .signin button:active {
    background: var(--navy);
    color: var(--white);
    transform: scale(0.97);
  }
  /* The line under the button ("Access denied.", "Sending failed…"), BY
     EYE (owner, 2026-10-03): button edge -> its letters 30 (= intro -> "Email
     address": a separate group); its baseline -> card bottom 60 (phones 30).
     The -7px (below) takes back the space a 24px line keeps under its letters. */
  .signin .message {
    margin: 25px 0 0;
    font-size: 15px;
    line-height: 24px;
  }
  /* ONE card size (owner, 2026-10-03): when the line is the last thing in the
     card, its slot is ALWAYS kept, so the card never grows or shrinks and
     nothing moves when "Access denied." or "Sending failed. Try again."
     appears. Card top -> "Sign in" = button -> card bottom = 30 + the 12px
     letters + 60 = 102 by eye (phones 30 + 12 + 30 = 72); sides stay 60
     (phones 30). Every line must fit ONE row in the 220px a 320px phone
     leaves, so it never names anything of varying length (an address goes
     in the field instead). */
  .signin .message:empty { display: none; }
  .signin form:last-child .message { display: block; min-height: 24px; margin-bottom: -7px; }
  .signin .or {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 21px 0; /* button -> line and line -> next button = 30 each */
    font-size: 15px;
    font-weight: 400;
    color: var(--navy);
  }
  .signin .or::before,
  .signin .or::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--navy);
  }

  /* ---- After-send: the opening-page standard's message, exactly ---- */
  .empty-state {
    color: #8A93A3;
    font-size: 20px;
    font-weight: 400;
    text-align: center;
    padding: 0 0 60px;
    margin: 0;
  }
  @media (min-width: 1728px) {
    .empty-state { margin-top: -4px; }
  }
  @media (max-width: 1727px) {
    .report-tiles { margin: 0 0 40px; }
    h1 { margin-bottom: 40px; }
  }
  @media (max-width: 720px) {
    h1 { font-size: 44px; line-height: normal; }
    .signin { padding: 69px 30px 30px; } /* phones: top = bottom = 72 by eye (30 + 12 + 30); sides 30 */
  }
  @media (max-width: 359px) {
    h1 { font-size: 38px; }
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Inbox Report</h1>
    <div class="report-tiles"></div>
    <div class="signin">
      <h2>Sign in</h2>
      <p>Your inbox report is private. Enter your email address and we’ll send you a link to sign in.</p>
      <form id="signInForm">
        <label for="signInEmail">Email address</label>
        <input type="email" id="signInEmail" autocomplete="email" required>
        <button type="submit">Send me a sign-in link</button>
        <p class="message" id="signInMessage" aria-live="polite"></p>
      </form>
      <!-- The passkey route: show ONLY once passkeys genuinely work (no dead buttons). -->
      <div class="or">or</div>
      <button type="button" class="passkey">Sign in with passkey</button>
    </div>
    <p class="empty-state" id="sentMessage" hidden>Done. Check your email for your sign-in link.</p>
  </div>
  <script>
    // LOCKED BEHAVIOUR. Click -> "Done", INSTANTLY (owner 2026-10-02: seamless):
    // no "Sending…", no spinner, the button never changes; the email is sent in
    // the background and only a genuine failure brings the box back with the
    // error. On a real page `sendLink` is:
    //   supabase.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: <this page> } })
    // and the SAME "Done" shows whatever email was typed (a stranger never learns
    // which emails are allowed). Only a genuine failure (network, rate limit)
    // keeps the box and shows a short error under the button.
    // This reference file sends nothing.
    const sendLink = async () => ({ error: null });
    let sending = false;
    document.getElementById('signInForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (sending) return; // ignore double clicks while Supabase sends: no duplicate emails
      sending = true;
      document.querySelector('.signin').hidden = true; // "Done" at once
      document.getElementById('sentMessage').hidden = false;
      const { error } = await sendLink(document.getElementById('signInEmail').value.trim());
      sending = false;
      const genuineFailure = error && (error.status === 429 || error.status >= 500 || !error.status);
      if (genuineFailure) { // rare: the box comes back with the error
        document.getElementById('signInMessage').textContent = 'Sending failed. Try again.';
        document.getElementById('sentMessage').hidden = true;
        document.querySelector('.signin').hidden = false;
      }
    });
  </script>
</body>
</html>
