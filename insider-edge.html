<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Insider Edge — Masterboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* Same design tokens as index.html/investments.html -- copied
     verbatim, not just similar, same as every other PrimeLevel tool. */
  :root {
    --navy: #1E2633;
    --white: #F9F9FA;
    --gold: #B29B68;
    --input-bg: #2A3441;
    --placeholder: #8A93A3;
    --border: #3A4453;
    --green: #4CAF7D;
    --orange: #D9A441;
    --red: #E45858;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy);
    font-family: 'Montserrat', sans-serif;
    min-height: 100%;
  }
  /* max-width: 1240px -- widened from the 1040px shared with Masterboard/
     Investments, by exactly 100px each side (200px total), per explicit
     request. The report card below fills this container directly (no
     longer sharing width with a sidebar), so widening the container is
     what widens the report itself. */
  .container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 100px 20px 80px;
  }
  h1 {
    color: var(--gold);
    font-weight: 700;
    font-size: 60px;
    margin: 0 0 100px;
    text-align: center;
  }
  /* .back-link removed per explicit request 2026-08-26 -- deliberately
     relies on the browser's own back navigation instead now. Real
     trade-off flagged before removing (no guarantee of browser history
     on every device/context, e.g. opening via the desktop shortcut) --
     user's own explicit call, may revisit later. */

  /* Report tiles -- per explicit request, no longer a sidebar sharing
     space with the report card. Pinned to the left edge of the viewport
     exactly like index.html's own .tiles (position:fixed; left:40px;
     same 15px gap, same 200x50px button size/colors/font/hover) -- same
     "top starts at a sensible fallback, then JS measures the real top of
     the content and overwrites it" pattern as index.html's own
     alignTilesToPicture(), see alignReportTiles() in the module script
     below, so a tile always lands on the exact same horizontal line as
     the report card's own top edge, not a guessed pixel value. */
  .report-tiles {
    position: fixed;
    top: 48px;
    left: 40px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 200px;
  }
  /* Identical to index.html's own .tile -- same size, colors, font,
     hover -- per explicit request ("must match the width and the size
     of Investments/Renewals button"). Title-only, single line (a report
     title + date together don't fit a 50px-tall button at a readable
     size -- the date still shows in the main report card itself, so
     no information is actually lost, just not duplicated here). */
  .report-tile {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 50px;
    width: 200px;
    background: var(--input-bg);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 0 18px;
    color: var(--white);
    font-weight: 700;
    font-size: 18px;
    font-family: 'Montserrat', sans-serif;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .report-tile:hover {
    border-color: var(--white);
    transform: scale(1.025);
  }
  /* Subtle gold glow for a report the user hasn't opened yet -- per
     explicit request, a gentle "something new is here" signal, not a
     loud one. Removed permanently (see markReportRead() in the module
     script) the first time this specific report is actually opened,
     persisted so it doesn't come back on a later visit. transition
     lets it fade out smoothly the instant it's marked read, rather
     than vanishing abruptly mid-render. */
  .report-tile.unread {
    box-shadow: 0 0 10px 2px rgba(178, 155, 104, 0.55);
    transition: border-color 0.15s ease, transform 0.1s ease, box-shadow 0.3s ease;
  }
  /* Gold left-bar "selected" indicator removed per explicit request --
     the button label is now just the report's date (see the scripts
     below), short enough that which one is highlighted doesn't need a
     visual marker beyond what's already showing in the content card
     itself. */

  /* The report card now fills the (widened) container directly -- no
     longer flex:1 sharing a row with a sidebar, since the tiles moved
     out to their own fixed, independently-positioned column above. */
  .report-content {
    width: 100%;
    background: var(--white);
    border-radius: 10px;
    /* top 100px per explicit request -- distinct from the other three
       sides, which stay at 40px. */
    padding: 100px 40px 40px;
    color: var(--navy);
  }
  .report-content-title {
    font-weight: 700;
    font-size: 35px;
    margin-bottom: 5px;
    text-align: center;
    color: var(--gold);
  }
  .report-content-date {
    color: var(--gold);
    opacity: 0.6;
    font-size: 15px;
    /* 76px -- the requested 100px is the TOTAL gap from the TITLE's
       bottom edge to the body text (spanning through this date line),
       not this margin alone, same reasoning as the previous rounds:
       title's own 5px gap + date's own ~19px line height (unaffected
       by the title's font-size, a separate element) + this margin =
       100px total needs exactly 100 - 5 - 19 = 76px here. Verified
       live afterward, not just computed. */
    margin-bottom: 76px;
    text-align: center;
  }
  /* The actual report body -- Cowork writes real HTML here (see the
     insider_edge_reports table), rendered directly rather than escaped/
     shown as text. Trusted content: only a service-role key (never
     exposed to this public page) can ever write a row here, the public/
     anon key this page itself uses can only ever read -- see the
     table's own RLS/grants for why this is safe to render as-is rather
     than something arbitrary any site visitor could inject.
     Styling below targets Cowork's actual real output structure (plain
     HTML: <p> for the summary, <h3> per section, <ul>/<li> for tickers,
     inline color on the "Conviction: ..." span, which Cowork already
     sets itself per the prompt's own color guidance) -- not a guess,
     built by reading the real generated report first. Per explicit
     request: needs to be genuinely scannable, not just readable --
     real spacing between sections and between ticker entries, and a
     distinct look for each ticker's own code, so the eye can scan
     straight down the list without reading every word. */
  .report-body {
    font-size: 15px;
    line-height: 1.6;
  }
  .report-body p {
    margin: 0 0 20px;
  }
  .report-body h3 {
    color: var(--gold); /* unchanged per explicit request -- "leaving the gold" */
    font-size: 25px;
    font-weight: 700;
    /* top: paragraph-to-heading gap (e.g. the intro paragraph to
       "Section 2"), per explicit request. bottom: heading-to-first-item
       gap (e.g. "Section 2" to "SRTS"), corrected via explicit follow-up
       from an initial 20px to 30px, matching the same 30px used between
       items themselves below. One shared rule, applies uniformly to
       every section header (Section 1/2/3, Methodology) -- there's no
       way to target just one heading without adding a class Cowork's
       real HTML doesn't have. */
    margin: 50px 0 30px;
  }
  .report-body h3:first-child {
    margin-top: 0;
  }
  .report-body ul {
    margin: 0 0 8px;
    padding: 0;
    list-style: none;
  }
  /* Generous spacing is what actually makes a dense list scannable --
     each ticker reads as its own distinct block instead of the list
     blurring into one wall of text. The divider line between entries
     (border-bottom) was removed per explicit request -- spacing alone
     now does the separating. */
  .report-body li {
    margin-bottom: 30px; /* was 24px + a 24px padding-bottom + a border, per explicit request now just this one clean gap */
  }
  .report-body li:last-child {
    margin-bottom: 0;
  }
  /* The ticker code (always the first <strong> in each entry) gets its
     own slightly larger, letter-spaced treatment -- a real visual
     anchor to scan down the list for, distinct from the rest of the
     bold text (company name context, dollar figures) inside the same
     entry. */
  .report-body li > strong:first-child {
    font-size: 17px;
    letter-spacing: 0.02em;
  }

  .empty-state {
    color: var(--placeholder);
    font-size: 20px; /* bumped from 15px per explicit request -- matches Renewals'/Investments' own empty-state size */
    text-align: center;
    /* padding-top is 0, not the label's old 60px -- the h1 above already
       provides a 100px margin-bottom, so the title-to-message gap is
       exactly 100px, matching every other page. Bottom padding (60px)
       is left as-is -- purely visual balance below the text. */
    padding: 0 0 60px;
    width: 100%;
  }
</style>
</head>
<body>
  <div class="report-tiles" id="reportTiles"></div>

  <div class="container">
    <h1>Insider Edge</h1>
    <div id="content">
      <div class="empty-state" id="emptyState">
        No reports yet — check back after the next scheduled report.
      </div>
    </div>
  </div>

  <!-- Real, root-caused fix for a flash matching the picture's own saga
       on index.html: the module script below can't run AT ALL
       (including any instant-paint logic placed inside it) until its
       own `import` (fetched from esm.sh) resolves over the network --
       not always instant. This plain, non-module inline script has zero
       import/network dependency, so it runs the moment the HTML parser
       reaches it. It reads the same localStorage cache the module
       script also reads/writes, and paints the tiles + selected report
       directly -- duplicating the module script's own render structure
       so there's no visible difference once the real fetch confirms/
       corrects this moments later. Exposes what it found on
       window.__insiderEdgeCachedReports so the module script picks up
       the SAME state instead of resetting to empty first (which would
       itself cause a visible flicker). The tiles here are plain,
       non-clickable divs (not real buttons) -- real click handling
       needs the module script's own fetched state, so interactivity
       arrives a moment after the instant paint, same "paint first,
       upgrade quietly" pattern as the picture. -->
  <script>
    (function () {
      try {
        var cached = JSON.parse(localStorage.getItem('insider-edge-reports-cache-v1') || 'null');
        if (!cached || cached.length === 0) return;
        window.__insiderEdgeCachedReports = cached;

        var reportTiles = document.getElementById('reportTiles');
        var content = document.getElementById('content');
        var emptyState = document.getElementById('emptyState');
        var selected = cached[0];

        cached.forEach(function (report) {
          var tile = document.createElement('div');
          tile.className = 'report-tile';
          // Short date label, not the full title -- per explicit
          // request. Derived from created_at (a real date value)
          // rather than trying to parse/shorten Cowork's own title
          // text, which has no guaranteed format.
          tile.textContent = new Date(report.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
          reportTiles.append(tile);
        });

        var contentEl = document.createElement('div');
        contentEl.className = 'report-content';
        var contentTitle = document.createElement('div');
        contentTitle.className = 'report-content-title';
        contentTitle.textContent = selected.title;
        var contentDate = document.createElement('div');
        contentDate.className = 'report-content-date';
        contentDate.textContent = new Date(selected.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
        var body = document.createElement('div');
        body.className = 'report-body';
        body.innerHTML = selected.html_content; // trusted -- see the module script's own note on why
        contentEl.append(contentTitle, contentDate, body);

        emptyState.remove();
        content.append(contentEl);

        // Same alignment technique as index.html's alignTilesToPicture()
        // -- match the tiles' top to the report card's real rendered
        // top edge, not a guessed pixel value.
        reportTiles.style.top = Math.round(content.getBoundingClientRect().top) + 'px';
      } catch (e) {
        // Harmless -- private browsing, storage disabled, or anything
        // else -- the module script below handles everything normally
        // regardless, this is purely an optimistic head start.
      }
    })();
  </script>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // Same Supabase project every other PrimeLevel tool uses -- same
    // URL/key pattern as index.html.
    const SUPABASE_URL = 'https://kenlhcatkjthhzuaznpg.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_-gt5PPGL45s3hRsfOosH6g_q3yP-b-_';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const reportTilesEl = document.getElementById('reportTiles');
    const contentEl = document.getElementById('content');
    const emptyStateEl = document.getElementById('emptyState');

    const REPORTS_CACHE_KEY = 'insider-edge-reports-cache-v1';

    // reports/selectedId may already be pre-populated by the inline
    // pre-script above (zero network dependency, ran before this whole
    // module -- including its own `import` above -- had even finished
    // loading over the network). If so, don't stomp on that instant
    // paint by resetting to empty here.
    let reports = window.__insiderEdgeCachedReports || [];
    let selectedId = reports.length > 0 ? reports[0].id : null;

    // Same alignment technique as index.html's alignTilesToPicture() --
    // match the tiles' top to whatever #content is currently showing
    // (the empty state, the closed-state message, or a real report
    // card)'s real rendered top edge, not a guessed pixel value.
    // #content always holds exactly one child at a time, so its first
    // child is always the right measurement target regardless of which
    // state is current. Re-run after every render, since content
    // genuinely swaps in.
    function alignReportTiles() {
      const target = contentEl.firstElementChild;
      if (!target) return;
      reportTilesEl.style.top = `${Math.round(target.getBoundingClientRect().top)}px`;
    }
    document.fonts.ready.then(alignReportTiles);
    window.addEventListener('resize', alignReportTiles);
    window.addEventListener('load', alignReportTiles);
    alignReportTiles();

    // Per explicit request: a report tile glows gold ONCE, the first
    // time a report exists that the user hasn't opened yet, and that
    // glow is gone permanently (not just for this session) the moment
    // they open it -- persisted in localStorage so it survives closing
    // the tab/browser, not just navigating within the page. "Opened"
    // means an actual click on that tile specifically -- confirmed via
    // explicit follow-up: the newest report auto-displaying on page
    // load does NOT count as read on its own, even though its content
    // is already visible without clicking. Only markReportRead() being
    // called from the tile's own click handler below (not from
    // renderContent(), which also runs for the auto-selected default)
    // clears the glow.
    const READ_REPORTS_KEY = 'insider-edge-read-reports-v1';
    function getReadReportIds() {
      try {
        return new Set(JSON.parse(localStorage.getItem(READ_REPORTS_KEY) || '[]'));
      } catch {
        return new Set(); // harmless -- glow just won't persist correctly across visits
      }
    }
    function markReportRead(id) {
      try {
        const readIds = getReadReportIds();
        if (readIds.has(id)) return; // already marked -- skip the write
        readIds.add(id);
        localStorage.setItem(READ_REPORTS_KEY, JSON.stringify([...readIds]));
      } catch {
        // Harmless if storage is unavailable -- unread glow just won't persist across visits.
      }
    }

    function renderTiles() {
      // Rebuilds the whole tile set each time rather than diffing --
      // this page has no live-updating requirement (a fixed set of
      // reports fetched once on load), so the simplicity is worth it.
      reportTilesEl.innerHTML = '';
      const readIds = getReadReportIds();
      reports.forEach((report) => {
        const tile = document.createElement('button');
        tile.className = 'report-tile' + (readIds.has(report.id) ? '' : ' unread');
        // Short date label, not the full title -- per explicit request.
        // Derived from created_at (a real date value) rather than
        // trying to parse/shorten Cowork's own title text, which has
        // no guaranteed format.
        tile.textContent = new Date(report.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        tile.title = report.title; // full title still available on hover
        tile.addEventListener('click', () => {
          selectedId = report.id;
          markReportRead(report.id); // an explicit click, and only this, clears the glow -- see the note above
          renderTiles();
          renderContent();
        });
        reportTilesEl.append(tile);
      });
    }

    function renderContent() {
      contentEl.querySelectorAll('.report-content, .closed-state').forEach((el) => el.remove());
      const report = reports.find((r) => r.id === selectedId);
      if (!report) {
        // Per explicit request: clicking outside the report closes it
        // back to a plain dark screen -- but a genuinely blank screen
        // with no report AND no explanation can look broken rather than
        // intentional (same reasoning as every other empty state on
        // this site), so a short instructional message replaces it
        // instead of true silence. Only shown once real reports exist
        // at all -- the very-first-ever-visit empty state (no reports
        // in the table yet) is the separate, static emptyStateEl markup
        // in the HTML, untouched by this.
        if (reports.length > 0) {
          const closed = document.createElement('div');
          closed.className = 'empty-state closed-state';
          closed.textContent = 'Click a date on the left to open a report.';
          contentEl.append(closed);
        }
        alignReportTiles();
        return;
      }
      const card = document.createElement('div');
      card.className = 'report-content';
      const title = document.createElement('div');
      title.className = 'report-content-title';
      title.textContent = report.title;
      const date = document.createElement('div');
      date.className = 'report-content-date';
      date.textContent = new Date(report.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
      const body = document.createElement('div');
      body.className = 'report-body';
      body.innerHTML = report.html_content; // trusted -- see the CSS comment above on why
      card.append(title, date, body);
      contentEl.append(card);
      // Marking read/refreshing tiles is NOT done here on purpose --
      // per explicit request, only an actual click on a tile (see its
      // own click handler above) counts as "read," not the newest
      // report auto-displaying on page load. Every caller of
      // renderContent() already calls renderTiles() itself beforehand
      // when that's actually needed.
      alignReportTiles();
    }

    // Per explicit request: a left click anywhere outside the white
    // report card (and not on a tile, which has its own job of OPENING
    // a report) closes the currently-open report. Checks selectedId
    // first so this is a genuine no-op when nothing's open (avoids an
    // unnecessary re-render on every single click on the page).
    document.addEventListener('click', (e) => {
      if (selectedId === null) return;
      if (e.target.closest('.report-content') || e.target.closest('.report-tile')) return;
      selectedId = null;
      renderContent();
    });

    async function loadReports() {
      const { data, error } = await supabase
        .from('insider_edge_reports')
        .select('id, title, html_content, created_at')
        .order('created_at', { ascending: false });
      // If this fails or returns nothing, and the inline pre-script above
      // already instant-painted from a local cache, just leave that
      // display as-is rather than reverting to the empty state -- a
      // stale-but-real cached report is a better fallback than a false
      // "no reports yet" while this is a transient network hiccup.
      if (error || !data || data.length === 0) return;

      reports = data;
      selectedId = reports[0].id; // most recent report selected by default
      // Real bug found and fixed: emptyStateEl can already be null here.
      // If the inline pre-script above successfully instant-painted from
      // a cache, IT already removed #emptyState from the DOM before this
      // module script's own `document.getElementById('emptyState')`
      // line even ran -- so emptyStateEl was already null from the
      // start, and calling .remove() on it threw, silently killing the
      // rest of this function (renderTiles/renderContent's real-fetch
      // confirmation, and the cache write-back) every single time there
      // was a cached instant-paint, i.e. on almost every real visit.
      emptyStateEl?.remove();
      renderTiles();
      renderContent();

      // Keep the local instant-paint cache in sync on every real,
      // confirmed load -- so the NEXT visit's inline pre-script has
      // today's actual latest reports to paint from immediately.
      try {
        localStorage.setItem(REPORTS_CACHE_KEY, JSON.stringify(reports));
      } catch {
        // Harmless if storage is unavailable -- just means no instant paint next time.
      }
    }
    loadReports();
  </script>
</body>
</html>
