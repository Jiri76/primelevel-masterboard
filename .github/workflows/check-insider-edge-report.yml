name: Check Insider Edge weekly report

# Independent watchdog for the Insider Edge weekly report, deliberately
# separate from the Cowork pipeline that actually produces it. Twice
# now (7 Sept, 14 Sept 2026) that pipeline failed silently -- no report,
# and no error left behind anywhere. This workflow does not depend on
# Cowork, Supabase staying awake, or any Claude session being alive: it
# just asks "does a report exist for this week?" a few hours after it
# was due, and if not, opens a GitHub Issue -- which GitHub emails you
# about automatically, the same as any other repo notification.
on:
  schedule:
    # Mondays at 13:00 UTC -- several hours of buffer after the 6am UK
    # scheduled report time, enough room for the pipeline's own normal
    # retry/backoff (up to ~3h steady-state per the mistakes log) to
    # have already finished one way or the other.
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check-report:
    runs-on: ubuntu-latest
    steps:
      - name: Query the most recent report
        id: query
        shell: bash
        run: |
          # Rings the Insider Edge "doorbell" (insider_edge_heartbeat(),
          # 2026-09-30): it answers ONLY when the latest report was saved,
          # never its title or content (owner-only rule: the reports table
          # itself is for the owner alone). The public key is enough for it.
          KEY="sb_publishable_-gt5PPGL45s3hRsfOosH6g_q3yP-b-_"
          RESPONSE=$(curl -sS -X POST \
            "https://kenlhcatkjthhzuaznpg.supabase.co/rest/v1/rpc/insider_edge_heartbeat" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "response=$RESPONSE" >> "$GITHUB_OUTPUT"

          # Report is "fresh" if it was saved within the last 8 days
          # (a little over one week, so a report that ran slightly late
          # is not flagged as missing). No answer at all also counts as
          # "not fresh", so a broken doorbell raises the alarm too.
          CREATED_AT=$(echo "$RESPONSE" | tr -d ' ' | grep -o '"last_report_at":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -z "$CREATED_AT" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            CREATED_EPOCH=$(date -d "$CREATED_AT" +%s)
            NOW_EPOCH=$(date +%s)
            AGE_DAYS=$(( (NOW_EPOCH - CREATED_EPOCH) / 86400 ))
            echo "age_days=$AGE_DAYS" >> "$GITHUB_OUTPUT"
            if [ "$AGE_DAYS" -le 8 ]; then
              echo "fresh=true" >> "$GITHUB_OUTPUT"
            else
              echo "fresh=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Alert on the missing report, without duplicating open issues
        if: steps.query.outputs.fresh == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const response = `${{ steps.query.outputs.response }}`;
            const ageDays = `${{ steps.query.outputs.age_days }}`;
            const label = 'insider-edge-missing';
            const note = `Checked again on ${new Date().toISOString()} — still no report saved.\n\nMost recent report in the database:\n\`\`\`\n${response}\n\`\`\`\n\nAge of most recent report: ${ageDays || 'unknown'} days.`;

            // Reuse an already-open alert instead of piling up duplicates
            // every week the same underlying problem persists — repeated
            // near-identical issues/emails train you to start ignoring
            // them, which defeats the point of the alert existing at all.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: note,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Insider Edge report missing — week of ${new Date().toISOString().slice(0,10)}`,
                body: `The weekly Insider Edge report check found no report saved within the last 8 days.\n\n${note}\n\nThis means this week's Cowork scan likely failed to produce a report — check Cowork's own scheduled-task run history for what happened.\n\nThis issue will stay open and collect a comment each week this remains true, rather than a new issue piling up every time — close it once the report starts arriving normally again.`,
                labels: [label],
              });
            }
