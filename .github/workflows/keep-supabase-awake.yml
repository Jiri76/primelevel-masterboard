name: Keep Supabase awake

# Supabase's free tier auto-pauses a project after a period with no
# activity -- this is what caused the ~20 hour outage on 14 Sept 2026
# that silently blocked that week's Insider Edge report. This workflow
# does nothing but a single, tiny, read-only request once a day so the
# project always looks "recently active" and never gets the chance to
# pause. It rings the Insider Edge "doorbell" (the insider_edge_heartbeat()
# function, 2026-09-30) with the public key: a real database query, so the
# project counts as active, but it reveals ONLY when the latest report was
# saved -- never any report content (owner-only rule: the reports table
# itself is for the owner alone). --fail-with-body turns this run red if the
# database doesn't answer, instead of passing silently.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Poke Supabase to keep the project awake
        shell: bash
        run: |
          KEY="sb_publishable_-gt5PPGL45s3hRsfOosH6g_q3yP-b-_"
          curl -sS --fail-with-body -w "\nHTTP %{http_code}\n" -X POST \
            "https://kenlhcatkjthhzuaznpg.supabase.co/rest/v1/rpc/insider_edge_heartbeat" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
