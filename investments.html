<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Investments — Masterboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* Same design tokens as index.html -- copied verbatim, not just
     similar, same as every other PrimeLevel tool. */
  :root {
    --navy: #1E2633;
    --white: #F9F9FA;
    --gold: #B29B68;
    --input-bg: #2A3441;
    --placeholder: #8A93A3;
    --border: #3A4453;
    --green: #4CAF7D;
    --orange: #D9A441;
    --red: #E45858;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy);
    font-family: 'Montserrat', sans-serif;
    min-height: 100%;
  }
  .container {
    max-width: 1040px;
    margin: 0 auto;
    padding: 100px 20px 80px;
  }
  /* Same h1 language as Masterboard's own title -- not a coincidence,
     "placed in the same way" per explicit request. */
  h1 {
    color: var(--gold);
    font-weight: 700;
    font-size: 60px;
    margin: 0 0 100px;
    text-align: center;
  }
  /* .back-link removed per explicit request 2026-08-26 -- deliberately
     relies on the browser's own back navigation instead now. */

  /* Investment cards -- identical to Masterboard's own, moved here
     verbatim, not redesigned. White fill, 10px radius, fixed-width
     tracks + justify-content:center so the cluster centers at its
     natural size. Modular: one card per entry in HOLDINGS. */
  .holdings {
    display: grid;
    grid-template-columns: repeat(auto-fit, 300px);
    justify-content: center;
    gap: 40px;
  }
  /* Colors switched to match Renewals' own .item exactly, per explicit
     request -- was white-fill/navy-text (the original Masterboard tile
     look), now dark input-bg fill/white text/a real border, same as
     every renewal row. Hover swap (border-color white, scale 1.015) and
     border are also copied verbatim from Renewals' .item.row-hovered,
     not just similarly styled. */
  .holding-card {
    background: var(--input-bg);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    /* height 600px, per explicit follow-up request (was 300px, itself a
       fix from the original content-driven ~139px). */
    height: 600px;
    cursor: pointer;
    text-align: left;
    font-family: 'Montserrat', sans-serif;
    transition: border-color 0.15s ease, transform 0.1s ease;
    /* Now a real container for two mutually-exclusive views (display vs
       edit), same "one surface toggles in place" pattern as Renewals'
       own .item -- see buildHoldingCard() below. */
    display: flex;
    flex-direction: column;
  }
  .holding-card:hover {
    border-color: var(--white);
    transform: scale(1.015);
  }
  .holding-card:active {
    transform: scale(0.98);
  }
  .holding-ticker {
    color: var(--white);
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 2px;
  }
  .holding-name {
    color: var(--white);
    opacity: 0.6;
    font-size: 13px;
    margin-bottom: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Two stacked numbers now, not one -- per explicit request: line 3 is
     the instrument's own live price per unit, line 4 is the position's
     total value (price x units). Both still show "--" until a real
     price source is wired up (see the placeholder note below) -- a
     position value computed from a fake price would be actively
     misleading, not just incomplete. */
  .holding-price-row {
    margin-bottom: 10px;
  }
  .holding-price-label,
  .holding-position-label {
    color: var(--placeholder);
    font-size: 11px;
    margin-bottom: 1px;
  }
  .holding-price {
    color: var(--white);
    font-weight: 700;
    font-size: 22px;
  }
  .holding-position {
    color: var(--white);
    font-weight: 700;
    font-size: 22px;
  }
  .holding-placeholder-note {
    color: var(--placeholder);
    font-size: 11px;
    margin-top: auto;
  }

  /* Edit panel -- opened by clicking the card, replaces its normal
     display content in place (same interaction model as Renewals' own
     .edit-panel). Renewals' own layout was horizontal (fields, then
     Save/Delete, side by side in one wide row); this is the same
     colors/sizing/terminology turned VERTICAL to fit a narrow 300px
     card, per explicit request -- centered, same 16px/20px padding
     Renewals' own .item uses, same 8px gap language as its
     .edit-actions group. */
  /* justify-content: flex-start (not center) -- per explicit request,
     switched from auto-centered content to two fixed, deliberately
     computed distances instead: card-top-to-"Ticker" and
     Delete-button-bottom-to-card-bottom both exactly 100px. Solved, not
     guessed: card's own 18px padding + this panel's own padding = 100px
     on each side, with the bottom side also accounting for the real
     measured height of the note below Delete (28px) and its real gap
     above it (12px = the 8px flex gap + its own 4px margin-top) --
     100 - 18 - 28 - 12 = 42px padding-bottom, confirmed by live
     measurement afterward, not just computed on paper. */
  .holding-edit-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    height: 100%;
    gap: 8px;
    padding: 82px 20px 42px;
  }
  /* Field colors/sizing are Renewals' .edit-panel input, verbatim --
     background, border, radius, font-size, padding all identical.
     width:100% (not Renewals' fixed 276px) since this column is much
     narrower and everything needs to line up under each other, not
     sit in a wide horizontal row. Text stays LEFT-aligned (the
     default) rather than centered, even though the surrounding layout
     is centered -- centering EDITABLE variable-length text creates
     real typing friction (the cursor position drifts on every
     keystroke), an already-learned lesson on this project, not a new
     design opinion. */
  .holding-edit-panel input {
    background: var(--navy);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    padding: 6px 8px;
    outline: none;
    width: 100%;
  }
  /* Removes the native up/down spinner arrows on the Units field (type=
     "number"), per explicit request -- Firefox via appearance:textfield
     on the input itself, Chrome/Safari via their own vendor-prefixed
     pseudo-elements (the input still accepts typed numbers and its own
     min/step validation exactly as before, only the visible arrows are
     gone). */
  .holding-edit-panel input[type="number"] {
    appearance: textfield;
    -moz-appearance: textfield;
  }
  .holding-edit-panel input[type="number"]::-webkit-outer-spin-button,
  .holding-edit-panel input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .holding-edit-panel input::placeholder {
    color: var(--placeholder);
  }
  /* Button colors/sizing are Renewals' .edit-save-btn, verbatim --
     transparent fill, white outline, 0.45 resting opacity, same
     hover/active swap. width:100% (not Renewals' fixed 90px) for the
     same reason as the inputs above -- a uniform-width stacked column
     reads as centered, a small button under full-width inputs
     wouldn't. */
  .holding-edit-panel button {
    width: 100%;
    text-align: center;
    background: transparent;
    border: 1px solid var(--white);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 15px;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .holding-edit-panel button:hover {
    opacity: 1;
    background: var(--white);
    color: var(--navy);
    transform: scale(1.02);
  }
  .holding-edit-panel button:active {
    transform: scale(0.96);
  }
  .holding-edit-label {
    color: var(--placeholder);
    font-size: 11px;
    align-self: flex-start;
    margin-bottom: -4px;
  }
  .holding-edit-note {
    color: var(--placeholder);
    font-size: 11px;
    text-align: center;
    margin-top: 4px;
  }

  .empty-state {
    color: var(--placeholder);
    font-size: 20px;
    text-align: center;
    padding: 40px 0;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Investments</h1>
    <div class="holdings" id="holdings"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // Same Supabase project every other PrimeLevel tool uses -- same
    // URL/key pattern as index.html/insider-edge.html.
    const SUPABASE_URL = 'https://kenlhcatkjthhzuaznpg.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_-gt5PPGL45s3hRsfOosH6g_q3yP-b-_';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const holdingsEl = document.getElementById('holdings');
    let holdings = [];
    let editingId = null;

    async function loadHoldings() {
      // Real bug found and fixed during live testing: the 3 seed rows
      // were all inserted in one batch and share the exact same
      // created_at timestamp down to the microsecond, so ordering by
      // created_at alone left their relative order undefined -- a
      // second, always-unique sort key (id) makes it deterministic.
      const { data, error } = await supabase
        .from('investment_holdings')
        .select('*')
        .order('created_at', { ascending: true })
        .order('id', { ascending: true });
      if (error) {
        holdingsEl.innerHTML = '<div class="empty-state">Could not load holdings. Please refresh.</div>';
        return;
      }
      holdings = data;
      renderHoldings();
    }

    function renderHoldings() {
      holdingsEl.innerHTML = '';
      if (!holdings.length) {
        holdingsEl.innerHTML = '<div class="empty-state">Nothing tracked yet.</div>';
        return;
      }
      for (const h of holdings) {
        holdingsEl.append(buildHoldingCard(h));
      }
    }

    // Live price/position value are both still "--" -- no market-data
    // source is wired up yet (a real decision, not an oversight: the
    // user chose a live API lookup for the ticker<->name/price feature,
    // which needs an actual API key registered with a provider before
    // it can be built for real -- see the note in the edit panel).
    function formatMoney(n) {
      return n == null ? '—' : `$${n.toFixed(2)}`;
    }

    function buildDisplayView(card, holding) {
      const ticker = document.createElement('div');
      ticker.className = 'holding-ticker';
      ticker.textContent = holding.ticker;

      const name = document.createElement('div');
      name.className = 'holding-name';
      name.textContent = holding.name;

      const priceRow = document.createElement('div');
      priceRow.className = 'holding-price-row';
      const priceLabel = document.createElement('div');
      priceLabel.className = 'holding-price-label';
      priceLabel.textContent = 'Price per unit';
      const price = document.createElement('div');
      price.className = 'holding-price';
      price.textContent = formatMoney(null);
      priceRow.append(priceLabel, price);

      const positionLabel = document.createElement('div');
      positionLabel.className = 'holding-position-label';
      positionLabel.textContent = `Position (${holding.units} unit${holding.units === 1 ? '' : 's'})`;
      const position = document.createElement('div');
      position.className = 'holding-position';
      position.textContent = formatMoney(null);

      const note = document.createElement('div');
      note.className = 'holding-placeholder-note';
      note.textContent = 'placeholder — live price not wired yet';

      card.append(ticker, name, priceRow, positionLabel, position, note);
    }

    function buildEditView(card, holding) {
      const panel = document.createElement('div');
      panel.className = 'holding-edit-panel';
      // Stop a click inside the panel (an input, a button) from also
      // being read as "click the card" and re-toggling edit mode --
      // same reasoning as every other click-to-edit surface on this
      // project.
      panel.addEventListener('click', (e) => e.stopPropagation());

      const tickerLabel = document.createElement('div');
      tickerLabel.className = 'holding-edit-label';
      tickerLabel.textContent = 'Ticker';
      const tickerInput = document.createElement('input');
      tickerInput.value = holding.ticker;
      tickerInput.placeholder = 'e.g. AAPL';

      const nameLabel = document.createElement('div');
      nameLabel.className = 'holding-edit-label';
      nameLabel.textContent = 'Company name';
      const nameInput = document.createElement('input');
      nameInput.value = holding.name;
      nameInput.placeholder = 'e.g. Apple Inc.';

      const unitsLabel = document.createElement('div');
      unitsLabel.className = 'holding-edit-label';
      unitsLabel.textContent = 'Units';
      const unitsInput = document.createElement('input');
      unitsInput.type = 'number';
      unitsInput.min = '0';
      unitsInput.step = 'any';
      unitsInput.value = holding.units;

      // Update: real action today (re-renders the card's own display
      // fields live from whatever's currently typed, before Save is
      // pressed), but NOT the ticker<->name auto-lookup the user
      // actually asked for -- that needs a genuine live market-data API
      // key, which only the user can obtain by registering with a
      // provider (nothing Claude can sign up for on their behalf). Once
      // that key exists, this button is exactly where the real lookup
      // call belongs.
      const updateBtn = document.createElement('button');
      updateBtn.type = 'button';
      updateBtn.textContent = 'Update';
      // mousedown, not click -- same reasoning as Save/Delete below,
      // mirrored for consistency even though this button doesn't touch
      // Supabase.
      updateBtn.addEventListener('mousedown', () => {
        note.textContent = `Preview — not saved yet: ${tickerInput.value.toUpperCase()} · ${nameInput.value} · ${unitsInput.value || 0} unit(s). Live ticker↔name lookup isn't wired up yet — needs a market-data API key first.`;
      });

      // mousedown, not click -- exact same reasoning as Renewals' own
      // Save/Delete: a layout shift between mousedown and mouseup (e.g.
      // this row closing/reordering) can move the button out from under
      // the cursor before a click would fire on mouse-up. mousedown
      // resolves the action in the same synchronous pass, immune to
      // that.
      const saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.textContent = 'Save';
      saveBtn.addEventListener('mousedown', async () => {
        const updated = {
          ticker: tickerInput.value.trim().toUpperCase(),
          name: nameInput.value.trim(),
          units: parseFloat(unitsInput.value) || 0,
        };
        const { error } = await supabase
          .from('investment_holdings')
          .update(updated)
          .eq('id', holding.id);
        if (error) {
          note.textContent = 'Could not save — please try again.';
          return;
        }
        editingId = null;
        await loadHoldings();
      });

      // Same shared button style as Save -- Renewals deliberately does
      // NOT give Delete a separate "danger" color, just a different
      // label, and this mirrors that exactly rather than inventing a
      // red variant. Immediate delete on click, no confirmation dialog
      // -- same as Renewals' own Delete, not a stricter behavior
      // invented for this page.
      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.textContent = 'Delete';
      deleteBtn.addEventListener('mousedown', async () => {
        const { error } = await supabase
          .from('investment_holdings')
          .delete()
          .eq('id', holding.id);
        if (error) {
          note.textContent = 'Could not delete — please try again.';
          return;
        }
        editingId = null;
        await loadHoldings();
      });

      const note = document.createElement('div');
      note.className = 'holding-edit-note';
      note.textContent = 'Live ticker↔name lookup: not wired up yet (needs a market-data API key).';

      panel.append(
        tickerLabel, tickerInput,
        nameLabel, nameInput,
        unitsLabel, unitsInput,
        updateBtn, saveBtn, deleteBtn,
        note
      );
      card.append(panel);
    }

    function buildHoldingCard(holding) {
      const card = document.createElement('div');
      card.className = 'holding-card';
      card.addEventListener('click', () => {
        editingId = holding.id;
        renderHoldings();
      });

      if (editingId === holding.id) {
        buildEditView(card, holding);
      } else {
        buildDisplayView(card, holding);
      }
      return card;
    }

    loadHoldings();
  </script>
</body>
</html>
