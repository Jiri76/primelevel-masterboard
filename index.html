<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Masterboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* Copied verbatim from Renewals -- same tokens, not just similar
     colors, per explicit instruction. Every PrimeLevel tool shares this
     exact palette. */
  :root {
    --navy: #1E2633;
    --white: #F9F9FA;
    --gold: #B29B68;
    --input-bg: #2A3441;
    --placeholder: #8A93A3;
    --border: #3A4453;
    --green: #4CAF7D;
    --orange: #D9A441;
    --red: #E45858;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy);
    font-family: 'Montserrat', sans-serif;
    min-height: 100%;
  }
  /* Title is genuinely centered on the full page (this is a real
     page-width container, margin:0 auto). The tiles are pulled OUT of
     this flow entirely (see .tiles below, position:fixed) so the two
     can be independently positioned: tiles pinned to the left edge of
     the viewport, title centered on the whole screen -- these are no
     longer the same box, on purpose. */
  .container {
    max-width: 1040px;
    margin: 0 auto;
    padding: 100px 20px 80px;
  }
  h1 {
    color: var(--gold);
    font-weight: 700;
    font-size: 60px;
    margin: 0 0 100px;
    text-align: center;
  }

  /* Link tiles -- same card language as Renewals' item rows (input-bg,
     border, 10px radius), stacked vertically, each just a plain link
     out to its own existing tool. Pinned to the left edge of the
     viewport (left never changes), independent of .container so it
     doesn't move when the centered title resizes.
     `top` starts at a sensible fallback for first paint, then JS
     measures the real top of the picture placeholder and overwrites
     it -- see alignTilesToPicture() below -- so the FIRST tile (whichever
     one alphabetically sorts first -- see the TILES array in JS) lands
     on the exact same horizontal line as the picture's own top edge,
     not a guessed pixel value. Re-instated per explicit request after
     briefly being a static fallback once the old holding cards (the
     previous alignment target) moved to investments.html. */
  .tiles {
    position: fixed;
    top: 48px;
    left: 40px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 200px;
  }
  /* Fixed 50px height via flex-centering rather than padding, so the
     height is an exact pixel value regardless of font metrics -- not
     a side-effect of top/bottom padding that happens to add up close
     to 50px. */
  /* font-size: 20px (was 15px) -- matched to Renewals' own item-name
     font size, per explicit request. font-weight was already 700 on
     both, unchanged -- confirmed identical bold weight before this
     change, this only brings the size in line too. */
  /* justify-content:center added -- per explicit request, the label
     text is now centered horizontally too, not just vertically
     (align-items:center already handled that). Since each tile
     stretches to the full 200px .tiles width (flex-column's default
     cross-axis stretch), centering means equal left/right space
     around whatever that specific label's own rendered width is --
     genuinely symmetric per tile, not a fixed padding value that only
     happens to look centered for one label length. */
  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 50px;
    background: var(--input-bg);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 0 18px;
    color: var(--white);
    font-weight: 700;
    font-size: 18px;
    text-decoration: none;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  /* scale(1.025) on hover -- bumped up from 1.02 (which itself was
     bumped from 1.015) per explicit request. No longer literally
     identical to Renewals' 1.5% item-row pop -- that was the original
     request, since superseded twice for tiles only. */
  .tile:hover {
    border-color: var(--white);
    transform: scale(1.025);
  }

  /* Placeholder for the (not-yet-built) main picture -- 800x500 (width
     widened from 700px, +50px each side, per explicit request), still
     centered under the title via margin:0 auto -- same horizontal
     centering logic as before, just a wider box within it, so the
     left/right margins from the viewport shrink symmetrically rather
     than the box shifting off-center. Click opens the native file
     picker (a hidden real <input type="file">, triggered programmatically
     -- the only reliable cross-browser way to make an arbitrary element
     act as an upload trigger); the chosen image previews inside the box
     immediately (object-fit:cover, session-only via createObjectURL --
     nothing persisted anywhere yet, this is just to SEE it working). */
  /* border: 1px solid var(--white) (was 1px dashed var(--border)) --
     a real "picture frame" line now, per explicit request ("company's
     white" = the standard --white token used everywhere else), not
     the dashed placeholder-style border it started as. */
  /* flex-direction:column + gap:50px -- per explicit request, when an
     error message is showing (label and error both visible at once,
     since only has-image hides them), they stack vertically (error on
     top, label below, see the swapped HTML order below) with a 50px
     gap between them, rather than sitting side by side in a row. gap
     only actually creates space between elements that are BOTH
     display:block -- a display:none sibling (the normal case, only
     the label showing) contributes nothing, so this is safe to leave
     on unconditionally. justify-content:center still centers the
     whole stack vertically within the box; align-items:center now
     centers each line horizontally (its role swaps with the axis
     change, same net effect). The img (has-image state) is unaffected
     -- its own explicit width/height:100% fill the box regardless of
     flex-direction. */
  .image-placeholder {
    width: 800px;
    height: 500px;
    margin: 0 auto;
    background: var(--input-bg);
    border: 1px solid var(--white);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 50px;
    cursor: pointer;
    overflow: hidden;
    position: relative;
  }
  .image-placeholder-label {
    color: var(--placeholder);
    font-size: 15px;
    text-align: center;
  }
  /* Real bug found and fixed: previously, a file the browser couldn't
     actually render (most commonly a HEIC photo straight from an
     iPhone -- Chrome/Firefox/Edge can't display that format in an
     <img> at all, only Safari on Mac can) failed completely silently.
     The picker would let you choose it, then nothing happened, no
     explanation. Same red/13px language as Renewals' .date-error, for
     consistency across the whole PrimeLevel family. */
  /* font-size: 15px (was 13px) -- bumped up per explicit request,
     matching .image-placeholder-label's own 15px so both lines of the
     stacked message read at the same size. */
  .image-placeholder-error {
    display: none;
    color: var(--red);
    font-size: 15px;
    text-align: center;
    padding: 0 30px;
  }
  .image-placeholder-error.visible {
    display: block;
  }
  /* cursor:grab/grabbing and user-select:none -- affordance for the
     drag-to-reposition feature below. Prevents the browser's native
     text/image-drag selection artifact during a real drag (same class
     of fix as Renewals' item rows -- see that project's own
     user-select:none note). */
  /* Real bug found and fixed: zoom needs the ability to render the
     picture BIGGER than object-fit:cover's own fixed minimum size, which
     object-fit itself has no way to do (it always computes its own one
     "just covers" scale from the image's intrinsic size). The fix:
     object-fit/object-position are gone entirely -- position:absolute +
     a single combined `transform: translate(...) scale(...)` (computed
     in JS, see renderTransform()) now does ALL of the sizing AND
     positioning, for both the zoom=1 case and any zoom level beyond it,
     with one unified mechanism instead of two that stop working together
     once zoom is involved (the first zoom attempt broke exactly this way
     -- it resized the img element's own box to match its scaled content,
     which destroyed the "smaller box than content" relationship
     object-position needs in order to have anything to pan within).
     transform-origin: 0 0 makes the scale math anchor at the image's own
     top-left corner, matching how the translate offset below is computed
     (from the frame's top-left, not its center). */
  .image-placeholder img {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    display: none;
    cursor: grab;
    user-select: none;
    /* Real bug found and fixed: without this, a VERTICAL drag on a
       trackpad/touchscreen gets hijacked by the browser's own native
       "scroll the page" gesture before the pointermove handler below
       ever sees it -- horizontal drag works because pages don't
       scroll sideways by default, so nothing competes for it. This is
       exactly why "I can drag horizontally but not vertically" was
       reported despite the underlying math (tested directly: this
       exact photo's real overflow is 0px horizontal, 101px vertical --
       vertical was the one with room to move, and still failed).
       touch-action:none tells the browser this element handles its
       own gestures entirely, so it stops intercepting any direction. */
    touch-action: none;
  }
  .image-placeholder img.dragging {
    cursor: grabbing;
  }
  .image-placeholder.has-image .image-placeholder-label {
    display: none;
  }
  .image-placeholder.has-image img {
    display: block;
  }
  /* A picture that displayed fine locally but failed to SAVE is a
     different situation from a file that can't be shown at all -- the
     error still needs to be real and visible (never fail silently),
     but shouldn't force the picture itself to hide. Shown as a bar
     overlaid at the bottom of the still-visible picture instead of
     the centered message used for the pre-image empty state. */
  .image-placeholder.save-failed .image-placeholder-error {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    margin: 0;
    padding: 14px 20px;
    background: rgba(30, 38, 51, 0.9);
  }
  /* Opaque "Uploading..." cover while a new picture is being processed
     -- a real, measured problem this fixes: the OLD picture stayed
     visible for a couple of real seconds after clicking (decoding a
     large phone photo isn't instant), with nothing on screen to say
     anything was happening, then the new picture would suddenly appear,
     THEN a status message would show briefly. Per explicit request,
     this now happens the instant a file is chosen (see JS below --
     'uploading' is added before anything else runs, not after the old
     preview approach's decode step), is fully opaque (not a translucent
     overlay -- the old picture must NOT show through at all), and is
     the ONLY thing on screen until the new picture is actually ready to
     replace it, at which point this disappears and the new picture
     appears in the same instant. Text styling deliberately matches
     Renewals' own "Sending..." button state for color and weight (white,
     bold) and its 0.45 resting opacity (that's genuinely what gives
     "Sending..." its slightly muted/grey look, not a different color) --
     but at 20px, not the button's own 15px, per explicit follow-up
     requests (first bumped to 18px to match the tiles' own font-size,
     then bumped again to 20px). The dimming is on the inner text span
     only, NOT this outer background box -- the box must stay fully
     opaque (see the paragraph above: the old picture must never show
     through), only the text itself should read as dimmed, same as the
     button. */
  .image-placeholder-status {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    margin: 0;
    background: var(--navy);
    text-align: center;
  }
  .image-placeholder.uploading .image-placeholder-status {
    display: flex;
  }
  .image-placeholder-status-text {
    color: var(--white);
    font-weight: 700;
    font-size: 25px; /* per explicit request -- bumped up from 20px; Renewals' Sending... button stays 15px */
    opacity: 0.45;
  }
</style>
</head>
<body>
  <div class="tiles" id="tiles"></div>

  <div class="container">
    <h1>Masterboard</h1>
    <div class="image-placeholder" id="imagePlaceholder">
      <span class="image-placeholder-error" id="imagePlaceholderError"></span>
      <span class="image-placeholder-label">Click to select a picture</span>
      <img id="imagePreview" alt="" />
      <span class="image-placeholder-status"><span class="image-placeholder-status-text">Uploading…</span></span>
      <input type="file" id="imageInput" accept="image/*" hidden />
    </div>
  </div>

  <!-- Real, root-caused fix, third attempt at this specific flash --
       confirmed live by the user that the first two attempts (moving
       the instant-paint out of the module script; forcing
       cache:'no-store' on the settings fetch) both still left a real,
       visible gap on a Google Calendar round trip and a fresh desktop-
       shortcut launch, plus a smaller one even on a plain reload. Root
       cause, now properly identified: EVERY previous fix, however
       early it ran, still ultimately depended on the PICTURE ITSELF
       finishing a real network fetch (even from a warm HTTP cache,
       decode time isn't literally zero) before anything meaningful
       could paint -- there was no version of "fetch the real photo
       faster" that could guarantee zero visible gap under all network
       conditions. The only fix with NO network dependency at all is to
       not need the network for the very first paint: a tiny (80x50),
       low-quality thumbnail of the picture is generated and stored
       (as a base64 data URI, alongside the position/zoom/version) every
       time the real picture successfully saves or loads -- see
       makeThumbnail() in the module script below. A data URI decodes
       from memory, not the network, so this script can paint it
       essentially instantly regardless of connection speed or cache
       state. The real, full-resolution picture then loads in the
       background exactly as before and swaps in seamlessly (a gentle
       "sharpen," not an empty-to-picture jump) once it's ready -- see
       the module script's paintPicture() for that. Falls back to the
       old hand-built full-URL approach if no thumbnail is cached yet
       (e.g. the very first time this runs after this fix ships). -->
  <script>
    (function () {
      try {
        var cached = JSON.parse(localStorage.getItem('masterboard-picture-cache-v1') || 'null');
        if (!cached) return; // nothing cached yet -- fine, the module script below handles this normally
        var img = document.getElementById('imagePreview');
        var placeholder = document.getElementById('imagePlaceholder');
        img.crossOrigin = 'anonymous'; // must be set before src -- see the module script's own note on this
        if (cached.thumb) {
          // Real bug found and fixed, confirmed via the user's own saved
          // zoom value (1.7x): the thumbnail drawn by makeThumbnail() in
          // the module script below is already a FINISHED snapshot --
          // it's drawn FROM the exact crop/zoom/pan the user had, baked
          // directly into its 800x500 pixels. Re-running the SAME pan/
          // zoom math against it here (as the old code below still does,
          // correctly, for the raw un-cropped photo) double-applies the
          // zoom on top of an image that's already zoomed -- looks
          // exactly like what was reported: the picture briefly renders
          // too big, then "shrinks" once the real photo (correctly
          // sized against its own true natural dimensions) replaces it.
          // The fix: a cached thumbnail needs NO transform at all, it's
          // already the exact final picture -- just show it as-is.
          img.onload = function () {
            placeholder.classList.add('has-image');
          };
          img.src = cached.thumb;
        } else if (cached.version) {
          // Fallback for the (now rare) case of no thumbnail cached yet
          // -- this loads the RAW, un-cropped photo at its true natural
          // size, so it genuinely does need the full pan/zoom math
          // applied, same as the module script's own paintPicture().
          var url = 'https://kenlhcatkjthhzuaznpg.supabase.co/storage/v1/object/public/masterboard-assets/hero?v=' + encodeURIComponent(cached.version);
          img.onload = function () {
            placeholder.classList.add('has-image');
            var frameRect = placeholder.getBoundingClientRect();
            var zoom = cached.zoom || 1;
            var scale = Math.max(frameRect.width / img.naturalWidth, frameRect.height / img.naturalHeight) * zoom;
            var overflowX = Math.max(0, img.naturalWidth * scale - frameRect.width);
            var overflowY = Math.max(0, img.naturalHeight * scale - frameRect.height);
            var tx = -(overflowX * cached.x) / 100;
            var ty = -(overflowY * cached.y) / 100;
            img.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
          };
          img.src = url;
        }
      } catch (e) {
        // Harmless -- private browsing, storage disabled, or anything
        // else -- the module script below handles everything normally
        // regardless, this is purely an optimistic head start.
      }
    })();
  </script>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // Same Supabase project Renewals already uses -- same URL/key,
    // confirmed via get_publishable_keys, not guessed/copied blind.
    const SUPABASE_URL = 'https://kenlhcatkjthhzuaznpg.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_-gt5PPGL45s3hRsfOosH6g_q3yP-b-_';
    // Real root cause found and fixed: the settings GET (which fetches
    // picture_version, the whole basis for the picture's cache-busted
    // URL) hits the EXACT SAME URL every single time -- unlike the
    // picture request, it carries no cache-busting parameter, since
    // there's nothing to bust it WITH until this very response comes
    // back. Confirmed live: that response carries no Cache-Control or
    // ETag header at all, which leaves the browser free to apply its
    // own unpredictable heuristic caching -- explaining why the bug
    // struck even through a genuinely fresh internal link navigation
    // (Investments' own link, no back button, no bfcache involved at
    // all) and why it was inconsistent rather than reliably reproducible
    // every single time. This was the actual root cause the earlier
    // pageshow/visibilitychange fixes were unknowingly working around,
    // not fixing -- those addressed a real but different, narrower
    // problem (frozen page snapshots) and left this one untouched.
    // Fixed at the source: every request this client makes (settings
    // reads/writes, storage uploads) now explicitly bypasses the
    // browser's HTTP cache entirely, rather than trusting server
    // headers that turned out to be absent. This does NOT affect the
    // picture's own load speed -- the <img> tag's fetch is a separate
    // browser mechanism this client doesn't touch, so the version-keyed
    // caching that makes repeat views of the SAME picture instant is
    // untouched.
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      global: { fetch: (url, options) => fetch(url, { ...options, cache: 'no-store' }) },
    });

    // A dedicated public bucket, one fixed object key ('hero', no
    // extension -- Content-Type is set explicitly on upload, so the
    // browser renders it correctly regardless of the original file's
    // format, and the URL never needs to change). Every new upload
    // overwrites this same object (upsert:true) -- there's only ever
    // one "current" picture, no version history to manage. Bucket read
    // AND write are both open (no `to authenticated` restriction) --
    // an explicit, accepted trade-off since Masterboard has no sign-in
    // and its URL is private/never shared; real access control (a
    // sign-in gate, reusing Renewals' own magic-link pattern, or a
    // password-gated Edge Function) can be layered on later without
    // touching the picture itself, since it only means swapping these
    // two policies for stricter ones.
    const PICTURE_BUCKET = 'masterboard-assets';
    const PICTURE_KEY = 'hero';

    // ---- Link tiles -- add more tools here, nothing else to touch. ----
    // TODO: Insider Edge's real URL is a placeholder ("#") until confirmed.
    // Investments now points to its own page -- the 3 holding cards moved
    // there entirely (per explicit request), this page no longer has a
    // holdings section to anchor-scroll to.
    // Alphabetical order, per explicit request: Calendar, Insider Edge,
    // Investments, Renewals -- "Calendar" sorts before all three (C < I),
    // "Insider" before "Investments" (4th letter i < v), both before
    // "Renewals" (starts with R). Calendar links straight to Google
    // Calendar's own site -- no sign-in flow of ours involved, the click
    // just opens Google's own page, where the user's own Google session
    // (if any) takes over from there.
    const TILES = [
      { label: 'Calendar', href: 'https://calendar.google.com/' },
      { label: 'Insider Edge', href: '#' },
      { label: 'Investments', href: 'investments.html' },
      { label: 'Renewals', href: 'https://jiri76.github.io/primelevel-renewals/' },
    ];

    const tilesEl = document.getElementById('tiles');

    function buildTile({ label, href }) {
      const a = document.createElement('a');
      a.className = 'tile';
      a.href = href;
      a.textContent = label;
      return a;
    }

    TILES.forEach((t) => tilesEl.append(buildTile(t)));

    // ---- Picture placeholder -- now genuinely persisted to Supabase
    // Storage (was session-only via createObjectURL alone). Clicking
    // the box triggers the real (hidden) file input -- the standard,
    // reliable way to make an arbitrary element act as an upload
    // trigger, since a plain <div> can't open a file picker on its
    // own. ----
    const imagePlaceholder = document.getElementById('imagePlaceholder');
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const imagePlaceholderError = document.getElementById('imagePlaceholderError');
    imagePreview.draggable = false; // suppress the browser's own native image-drag-ghost, so our custom pointer-drag below is the only drag behavior
    // Required so a canvas can read back the (cross-origin, Supabase-
    // hosted) picture's pixels without a SecurityError -- see
    // makeThumbnail() below. Confirmed safe first: Supabase's public
    // storage responses carry Access-Control-Allow-Origin: *. Also set
    // in the inline pre-script above (before it ever assigns `src`) --
    // setting this AFTER src is already loading/loaded can force an
    // unwanted re-fetch, so both scripts set it before their own first
    // src assignment; setting the same value twice here is a harmless
    // no-op.
    imagePreview.crossOrigin = 'anonymous';

    // ---- Picture position/zoom state -- tracked directly in JS (not
    // read back from CSS via getComputedStyle) since the picture is now
    // positioned with a single combined `transform`, not object-position.
    // posX/posY are 0-100%, the exact same "how far along the overflow"
    // meaning as before; currentZoom is a multiplier on top of
    // object-fit:cover's own minimum "just covers the frame" scale (1 =
    // exactly that minimum, no zoom). See renderTransform() below for how
    // these three combine into the actual on-screen result. ----
    let posX = 50;
    let posY = 50;
    let currentZoom = 1;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 3;

    // The one place that actually paints posX/posY/currentZoom to the
    // screen -- computes the effective scale (cover's own minimum, times
    // whatever zoom is dialed in) and how far the now-larger image
    // overflows the frame on each axis, then converts posX/posY's 0-100%
    // into a pixel translate offset. transform-origin is 0 0 (top-left,
    // see the CSS), so scaling first blows the image up anchored at its
    // own top-left corner, and the translate afterward slides it up/left
    // by however much of that overflow posX/posY says to reveal --
    // functionally identical to what object-position used to do, just
    // computed manually instead of left to the browser, which is what
    // makes it keep working once zoom adds overflow to axes that didn't
    // have any before.
    function renderTransform() {
      if (!imagePreview.naturalWidth) return; // not decoded yet -- called again once it is
      const frameRect = imagePlaceholder.getBoundingClientRect();
      const scale = Math.max(frameRect.width / imagePreview.naturalWidth, frameRect.height / imagePreview.naturalHeight) * currentZoom;
      const overflowX = Math.max(0, imagePreview.naturalWidth * scale - frameRect.width);
      const overflowY = Math.max(0, imagePreview.naturalHeight * scale - frameRect.height);
      const translateX = -(overflowX * posX) / 100;
      const translateY = -(overflowY * posY) / 100;
      imagePreview.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    // A real drag (see the pointerdown/move/up block further down) must
    // NOT also open the file picker -- justDragged tracks whether the
    // most recent pointer gesture actually moved enough to count as a
    // drag, so this click handler can skip opening the picker for that
    // one click only. A plain click (no real movement) still opens it,
    // whether there's already a picture showing or not (lets you
    // replace it), matching the original behavior.
    let justDragged = false;
    // Real bug found and fixed: nothing previously stopped a SECOND
    // upload from starting while a FIRST one was still mid-flight (a
    // multi-MB photo over mobile data can easily take several seconds --
    // long enough for an impatient re-tap). With no guard, two uploads
    // raced independently, and whichever one's request happened to reach
    // the server LAST won -- regardless of which one the user actually
    // meant to keep. Confirmed live: six upload attempts landed within
    // nine minutes of real testing, and the final stored picture did not
    // match the final thing the user picked. uploadInProgress blocks any
    // new upload (click-to-reopen AND a stray file-input change) until
    // the current one has fully resolved.
    let uploadInProgress = false;
    imagePlaceholder.addEventListener('click', () => {
      if (uploadInProgress) return;
      if (justDragged) { justDragged = false; return; }
      imageInput.click();
    });

    // HEIC/HEIF (the default format on modern iPhones) can be SELECTED
    // fine but can't be RENDERED by any browser except Safari -- rather
    // than just explain that (the previous fix), convert it to a real
    // JPEG right here in the browser before it ever reaches the
    // preview/upload code below, so it just works either way. Checks
    // both the reported MIME type AND the filename extension, since
    // some OS/browser combinations report HEIC files with an empty or
    // generic type instead of 'image/heic'.
    function isHeic(file) {
      const type = (file.type || '').toLowerCase();
      const name = (file.name || '').toLowerCase();
      return type.includes('heic') || type.includes('heif') || name.endsWith('.heic') || name.endsWith('.heif');
    }
    async function convertHeicToJpeg(file) {
      const { default: heic2any } = await import('https://esm.sh/heic2any');
      const result = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.9 });
      const blob = Array.isArray(result) ? result[0] : result; // HEIC can technically hold multiple images (rare); take the first
      return new File([blob], file.name.replace(/\.(heic|heif)$/i, '.jpg'), { type: 'image/jpeg' });
    }

    // Real fix for a real, measured slowness: a modern phone photo is
    // commonly 4000+px wide and several MB (confirmed live: 6.2MB for
    // one of this session's own test uploads) -- but the frame only
    // ever DISPLAYS at 800x500. Uploading the full original wastes real
    // time transferring pixels nobody can see, on every upload AND every
    // future page load. 1600px (2x the frame's width, generous headroom
    // for sharpness) at 85% JPEG quality is genuinely much smaller --
    // typically a few hundred KB instead of several MB -- so this
    // shrinks the actual wait, not just how it's communicated. Skips
    // re-encoding entirely if the photo is already at or under that
    // size, so a small image isn't needlessly re-compressed.
    async function compressImage(file, maxDimension = 1600, quality = 0.85) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, maxDimension / Math.max(bitmap.width, bitmap.height));
      if (scale === 1) {
        bitmap.close?.();
        return file;
      }
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close?.();
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', quality));
      return new File([blob], file.name.replace(/\.\w+$/, '.jpg'), { type: 'image/jpeg' });
    }

    // Real bug found and fixed: the OLD picture used to stay fully
    // visible for a couple of real seconds after a new one was chosen
    // (decoding a large phone photo isn't instant), with nothing on
    // screen to say anything was happening -- then the new picture
    // would suddenly appear, THEN a status message would show below it.
    // Per explicit request, the opaque "Uploading..." cover (see
    // .image-placeholder-status in the CSS) now goes up in the very
    // first line of this handler, before the old picture is touched at
    // all, and is the ONLY thing shown until the new picture has
    // actually been saved AND decoded -- the old picture is never shown
    // again once a new file is chosen, only ever the new one, once it's
    // genuinely ready.
    imageInput.addEventListener('change', async () => {
      if (uploadInProgress) return; // belt and braces alongside the click guard above
      let file = imageInput.files[0];
      if (!file) return;
      imagePlaceholderError.textContent = '';
      imagePlaceholderError.classList.remove('visible');
      imagePlaceholder.classList.remove('save-failed');

      uploadInProgress = true;
      imagePlaceholder.classList.add('uploading'); // reveals the static "Uploading…" cover -- see the HTML span, its text never changes

      try {
        if (isHeic(file)) {
          // Real conversion (WASM-based HEIC decode) happens here, but
          // per explicit request the status text stays 'Uploading…'
          // throughout -- the user doesn't need to know a format
          // conversion is involved, only that something is happening.
          try {
            file = await convertHeicToJpeg(file);
          } catch (err) {
            imagePlaceholderError.textContent = `Couldn't convert "${file.name}" — this HEIC file may be unusual or corrupted. Try a JPG or PNG instead.`;
            imagePlaceholderError.classList.add('visible');
            return;
          }
        }

        // Shrink to display size BEFORE the network call -- see
        // compressImage() below for why -- this is what actually cuts
        // the real wait, not just the visible status message. Also
        // doubles as the "can this browser even render this file"
        // check (createImageBitmap inside it throws for a genuinely
        // unrenderable format), replacing the old separate
        // preview-onerror safety net.
        let uploadFile;
        try {
          uploadFile = await compressImage(file);
        } catch (err) {
          imagePlaceholderError.textContent = `Couldn't display "${file.name}" — this browser can't render that image format. Try a JPG or PNG instead.`;
          imagePlaceholderError.classList.add('visible');
          return;
        }

        const { error } = await withRetry(() =>
          supabase.storage.from(PICTURE_BUCKET).upload(PICTURE_KEY, uploadFile, { upsert: true, contentType: uploadFile.type })
        );
        if (error) {
          // Nothing new has been shown yet (the cover is still up) --
          // surface this as the picture's normal empty/error state
          // rather than an overlay bar over a picture that was never
          // actually saved.
          imagePlaceholder.classList.remove('has-image');
          imagePlaceholderError.textContent = `Couldn't save the picture: ${error.message || error.code || 'unknown error'}`;
          imagePlaceholderError.classList.add('visible');
          return;
        }

        // Show the EXACT file that was actually saved -- no chance of a
        // mismatch between what's previewed here and what's stored (a
        // real, separate improvement over the old flow, which previewed
        // the original file but uploaded a different, compressed one).
        // Wait for it to actually decode before dropping the cover, so
        // the cover never disappears onto a still-blank picture.
        const objectUrl = URL.createObjectURL(uploadFile);
        await new Promise((resolve) => {
          imagePreview.onload = () => { imagePlaceholder.classList.add('has-image'); resolve(); };
          imagePreview.onerror = () => resolve(); // shouldn't happen for our own freshly-encoded output
          imagePreview.src = objectUrl;
        });
        URL.revokeObjectURL(objectUrl);

        // A brand-new picture resets to centered AND un-zoomed, rather
        // than inheriting the PREVIOUS picture's saved crop/zoom -- both
        // were tuned for a different photo's composition, so keeping
        // either would very likely look wrong on this new one. Persisted
        // too (not just visual), so a later reload doesn't snap back to
        // the old, now-stale position/zoom.
        posX = 50;
        posY = 50;
        currentZoom = 1;
        renderTransform();
        savePosition({ picture_version: String(Date.now()), image_zoom: 1 });
      } finally {
        uploadInProgress = false;
        imagePlaceholder.classList.remove('uploading');
      }
    });

    // Retries a Supabase call up to 3 times with a growing delay before
    // giving up -- real, recurring cause found live: a Postgres
    // notification-queue issue can prevent PostgREST from ever
    // receiving a schema-cache-reload signal, so a genuinely correct
    // grant/policy can still intermittently 401 for a while after being
    // set. Rather than keep chasing that exact infrastructure cause
    // indefinitely, this smooths over ANY transient failure (that one,
    // a network blip, or anything else) automatically -- most such
    // failures resolve within a second or two on their own.
    async function withRetry(fn, attempts = 3, delayMs = 800) {
      let lastError;
      for (let i = 0; i < attempts; i++) {
        const result = await fn();
        if (!result.error) return result;
        lastError = result.error;
        if (i < attempts - 1) await new Promise((r) => setTimeout(r, delayMs * (i + 1)));
      }
      return { error: lastError };
    }

    // NOTE: the actual upload now happens inline inside the imageInput
    // 'change' handler above (compress -> upload -> swap the preview to
    // the saved file -> bump picture_version), not as a separate
    // function -- it needs to run entirely behind the opaque "Uploading
    // ..." cover from the moment a file is chosen, which a standalone
    // post-preview function couldn't do.

    // Real regression found and fixed: removing the `?t=timestamp`
    // cache-bust (to fix the ~2s reload delay -- see git history)
    // meant the picture's URL never changed even when a genuinely NEW
    // picture was uploaded, so on the next visit the browser (or an
    // intermediate CDN/proxy layer that doesn't reliably honor
    // Cache-Control revalidation the way plain browser-to-origin
    // testing suggested it should) could keep serving the OLD picture
    // indefinitely -- confirmed for real: uploading a new picture,
    // navigating away, and back showed the previous one, not the new
    // one. Fixed properly this time: `picture_version` (bumped
    // alongside the position on every successful upload, see the
    // imageInput 'change' handler above) is appended to the picture's
    // URL as a stable cache-busting key. This gives BOTH correctness
    // (the URL only changes when the picture genuinely does, so a real
    // update is never missed) AND speed (repeat visits of the SAME
    // picture reuse the identical URL, so the browser's own cache can
    // serve it with zero network request at all -- not even a 304
    // round-trip).
    const PICTURE_CACHE_KEY = 'masterboard-picture-cache-v1';

    // Generates a tiny (80x50, matching the frame's own 1.6:1 aspect),
    // low-quality thumbnail of the CURRENTLY DISPLAYED crop (the same
    // position/zoom the user actually sees, not just the raw uncropped
    // photo) as a base64 data URI. This is the real fix for a flash
    // that survived two earlier, lighter-weight attempts -- see the
    // inline <script> above `<script type="module">` for the full
    // story. A data URI has ZERO network dependency (it decodes from
    // memory, not a fetch), so it's the only thing that can genuinely
    // guarantee an instant first paint regardless of connection speed
    // or cache state -- unlike the picture's own URL, which however
    // early it's requested still has to finish a real network round
    // trip first. Draws directly from the already-decoded imagePreview
    // element rather than re-fetching anything. Requires
    // imagePreview.crossOrigin = 'anonymous' (set above) plus Supabase
    // serving Access-Control-Allow-Origin: * on public storage objects
    // (confirmed directly via curl before relying on this) -- without
    // both, reading pixels back off a cross-origin image into a canvas
    // throws a SecurityError.
    function makeThumbnail() {
      try {
        // Full frame resolution (800x500) / 85% quality -- matching the
        // main picture's own compressImage() quality exactly, per
        // explicit request ("crystal clear like the picture"). No longer
        // really a "thumbnail" -- two smaller/blurrier sizes were tried
        // first and both left a visible soft-to-sharp moment; matching
        // the real picture's own quality is what actually makes the
        // swap imperceptible. Still comfortably small for localStorage
        // (a compressed JPEG at this size is typically well under 200KB,
        // against a typical 5-10MB budget).
        const THUMB_W = 800, THUMB_H = 500;
        const frameRect = imagePlaceholder.getBoundingClientRect();
        const scale = Math.max(frameRect.width / imagePreview.naturalWidth, frameRect.height / imagePreview.naturalHeight) * currentZoom;
        const overflowX = Math.max(0, imagePreview.naturalWidth * scale - frameRect.width);
        const overflowY = Math.max(0, imagePreview.naturalHeight * scale - frameRect.height);
        const srcX = (overflowX * posX) / 100 / scale;
        const srcY = (overflowY * posY) / 100 / scale;
        const srcW = frameRect.width / scale;
        const srcH = frameRect.height / scale;
        const canvas = document.createElement('canvas');
        canvas.width = THUMB_W;
        canvas.height = THUMB_H;
        canvas.getContext('2d').drawImage(imagePreview, srcX, srcY, srcW, srcH, 0, 0, THUMB_W, THUMB_H);
        return canvas.toDataURL('image/jpeg', 0.85);
      } catch {
        return null; // harmless -- just means no instant thumbnail next time, the normal fetch path still works
      }
    }

    // The one place that writes the local instant-paint cache -- called
    // once the real picture is confirmed genuinely displayed (so
    // makeThumbnail() has something correct to draw from), by both
    // paintPicture()'s onload below and savePosition() further down.
    function cachePictureLocally(state) {
      try {
        localStorage.setItem(PICTURE_CACHE_KEY, JSON.stringify({ ...state, thumb: makeThumbnail() }));
      } catch {
        // Harmless if storage is unavailable -- just means no instant paint next time.
      }
    }

    // Paints the picture's position/zoom + src from a {x, y, version, zoom}
    // object -- shared by the inline pre-script's optimistic paint (which
    // calls this indirectly by triggering onload) and the real
    // network-confirmed loadSettings() result below, so there's only one
    // place that actually touches the DOM for this. renderTransform()
    // runs inside onload, not before -- it needs the image's real
    // naturalWidth/Height, which isn't available until it's actually
    // decoded.
    function paintPicture({ x, y, version, zoom = 1 }) {
      posX = x;
      posY = y;
      const { data: urlData } = supabase.storage.from(PICTURE_BUCKET).getPublicUrl(PICTURE_KEY);
      imagePreview.onload = () => {
        imagePlaceholder.classList.add('has-image');
        currentZoom = zoom;
        renderTransform();
        cachePictureLocally({ x, y, version, zoom });
      };
      imagePreview.onerror = () => {
        // Nothing saved yet -- stay on the normal empty-state label.
      };
      imagePreview.src = `${urlData.publicUrl}?v=${encodeURIComponent(version)}`;
    }

    async function loadSettings() {
      const { data, error } = await supabase
        .from('masterboard_settings')
        .select('image_position_x, image_position_y, picture_version, image_zoom')
        .eq('id', 1)
        .single();
      if (error || !data) return; // fresh install, no row yet -- stay on CSS defaults

      paintPicture({ x: data.image_position_x, y: data.image_position_y, version: data.picture_version, zoom: data.image_zoom });
    }
    loadSettings();

    // Real bug found and fixed: Renewals has no link back to Masterboard,
    // so the only way back is the browser's own Back button -- and for
    // an external-site round trip like that, browsers frequently restore
    // the page from the back/forward cache (bfcache) instead of doing a
    // real reload. A bfcache restore repaints the exact frozen DOM from
    // the moment the user left, WITHOUT re-running any of the load-time
    // code above, so a position saved after that snapshot was taken
    // never shows up -- confirmed live: an internal link (Investments'
    // "back to Masterboard") and a full close/reopen both correctly
    // showed the saved position, only the Renewals round trip didn't,
    // which is exactly the bfcache-vs-real-navigation split. The
    // standard fix: `pageshow`'s `event.persisted` flag is true
    // specifically when the page came from the bfcache, so re-running
    // loadSettings() only in that case forces a genuine refresh from the
    // database -- a normal fresh load (persisted: false) is untouched,
    // since loadSettings() already ran once above for that case.
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) loadSettings();
    });

    // Belt and braces alongside pageshow above: confirmed live (via
    // Supabase's own request logs) that the DATABASE always has the
    // correct, latest picture -- the Renewals-back-button staleness the
    // user kept reporting is a real, but purely CLIENT-SIDE, symptom,
    // and pageshow's persisted flag isn't a fully reliable signal for
    // it across every browser/OS combination (real-world back/forward
    // caching heuristics vary a lot, especially on mobile). `visible`
    // fires every time the tab becomes visible again for ANY reason --
    // this browser's back button, switching apps and back, switching
    // browser tabs -- so it catches the same "the page might be showing
    // stale content" moment regardless of which specific underlying
    // browser mechanism is responsible, rather than betting on one named
    // API being reliable everywhere. Cheap to over-fire: when nothing
    // has actually changed, the picture URL is identical to what's
    // already showing, so the browser's own image cache serves it
    // instantly with no visible reload.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') loadSettings();
    });

    // ---- Drag-to-reposition -- click and hold on the picture, drag to
    // move which part of it shows through the frame (same interaction
    // as a profile-picture editor). Position is saved as CSS
    // object-position percentages (0-100 each axis) -- the exact unit
    // CSS already uses, so there's no conversion needed on load, and
    // the percentage range is INHERENTLY the full, exact valid range
    // for this image/frame pairing (0% = image's start edge flush with
    // the frame's start edge, 100% = image's end edge flush with the
    // frame's end edge) -- clamping to [0,100] is therefore already
    // exactly "never reveal empty space," not an approximation. ----
    let dragState = null;
    imagePreview.addEventListener('pointerdown', (e) => {
      if (!imagePlaceholder.classList.contains('has-image')) return;
      e.preventDefault(); // extra defense alongside touch-action:none above, belt and braces against native gesture interception
      dragState = { startX: e.clientX, startY: e.clientY, startPosX: posX, startPosY: posY, moved: false };
      try {
        imagePreview.setPointerCapture(e.pointerId);
      } catch {
        // Harmless if it fails -- capture is a robustness nicety (keeps
        // the drag tracking even if the cursor strays outside the
        // image mid-drag), not required for the core drag math above.
      }
    });
    imagePreview.addEventListener('pointermove', (e) => {
      if (!dragState) return;
      const dxPx = e.clientX - dragState.startX;
      const dyPx = e.clientY - dragState.startY;
      if (!dragState.moved && Math.hypot(dxPx, dyPx) > 3) {
        dragState.moved = true;
        justDragged = true; // stops the upcoming click from opening the file picker
        imagePreview.classList.add('dragging');
      }
      if (!dragState.moved) return;

      // How far the rendered image overflows the frame on each axis --
      // this IS the pixel distance that maps to the full 0-100% range,
      // computed from the image's real natural size and its current
      // effective scale (object-fit:cover's own minimum, times whatever
      // zoom the user has dialed in -- see renderTransform() above).
      // IMPORTANT, confirmed with real diagnostic data, not a guess: AT
      // ZOOM=1, for MOST photos only ONE axis will have any overflow at
      // all -- this is mathematically inherent to object-fit:cover's own
      // scaling rule, not a bug. An 800x500 (1.6:1) frame holding a
      // typical 4:3 phone photo (1.33:1) will have overflowX exactly 0
      // and real overflowY slack (confirmed live: a 4032x3024 photo gave
      // overflowX=0.0, overflowY=100.0) -- so only vertical dragging is
      // possible for that photo at zoom=1, and that's correct, not
      // something to "fix" by itself. Zooming in (see the wheel handler
      // below) is what adds real overflow to BOTH axes regardless of the
      // photo's own shape -- the actual, correct way to get full pan
      // freedom on any photo.
      const frameRect = imagePlaceholder.getBoundingClientRect();
      const scale = Math.max(frameRect.width / imagePreview.naturalWidth, frameRect.height / imagePreview.naturalHeight) * currentZoom;
      const overflowX = imagePreview.naturalWidth * scale - frameRect.width;
      const overflowY = imagePreview.naturalHeight * scale - frameRect.height;

      // Dragging the mouse right should reveal more of the image's LEFT
      // side (the content follows the cursor, like panning a canvas) --
      // that's a DECREASING posX, hence the minus sign.
      posX = overflowX > 0 ? clamp(dragState.startPosX - (dxPx / overflowX) * 100, 0, 100) : dragState.startPosX;
      posY = overflowY > 0 ? clamp(dragState.startPosY - (dyPx / overflowY) * 100, 0, 100) : dragState.startPosY;
      renderTransform();
    });
    imagePreview.addEventListener('pointerup', () => {
      imagePreview.classList.remove('dragging');
      if (dragState && dragState.moved) savePosition();
      dragState = null;
    });

    // Mouse-wheel zoom -- see renderTransform() above for why this is the
    // real fix for one-axis-only panning. A wheel gesture fires MANY
    // events per scroll tick, so the actual DB save is debounced (only
    // fires 500ms after the wheel goes quiet), while the visible zoom
    // itself updates on every single tick for a smooth, immediate feel --
    // the same "instant visual, eventually-persisted" split already used
    // for dragging (the transform updates live, savePosition() only fires
    // once on release).
    let zoomSaveTimer = null;
    imagePreview.addEventListener('wheel', (e) => {
      if (!imagePlaceholder.classList.contains('has-image')) return;
      e.preventDefault(); // stop the page itself from scrolling while zooming the picture
      currentZoom = clamp(currentZoom + (e.deltaY < 0 ? 0.1 : -0.1), MIN_ZOOM, MAX_ZOOM);
      renderTransform();
      // Zooming out can shrink the overflow on an axis that the CURRENT
      // posX/posY percentage was previously relying on -- but since
      // position is stored as a 0-100% fraction OF the overflow (not a
      // raw pixel offset), it's always automatically still within range
      // at any zoom level, with no extra reclamping needed here.
      clearTimeout(zoomSaveTimer);
      zoomSaveTimer = setTimeout(() => savePosition({ image_zoom: currentZoom }), 500);
    }, { passive: false }); // passive:false is required for preventDefault() to actually take effect on a wheel event

    function clamp(n, min, max) {
      return Math.min(max, Math.max(min, n));
    }

    // extraFields lets a caller bundle other columns into the SAME
    // update (e.g. the imageInput 'change' handler above also needs to
    // bump picture_version) -- one round-trip instead of two separate ones.
    async function savePosition(extraFields = {}) {
      const { error } = await withRetry(() =>
        supabase
          .from('masterboard_settings')
          .update({ image_position_x: posX, image_position_y: posY, updated_at: new Date().toISOString(), ...extraFields })
          .eq('id', 1)
      );
      if (error) {
        imagePlaceholder.classList.add('save-failed');
        imagePlaceholderError.textContent = `Couldn't save position: ${error.message || error.code || 'unknown error'}`;
        imagePlaceholderError.classList.add('visible');
      } else {
        imagePlaceholder.classList.remove('save-failed');
        // Keep the local instant-paint cache (incl. a freshly-redrawn
        // thumbnail, see cachePictureLocally() above) in sync with every
        // successful save (a plain drag, a zoom, OR an upload). Without
        // this, the VERY FIRST trip back after a save would still
        // instant-paint the OLD cached state for a brief moment before
        // self-correcting, rather than the new one being right first
        // time. Preserves whatever version/zoom is already cached when
        // this particular save didn't touch it (e.g. a plain drag
        // doesn't change zoom) -- only updates a field when extraFields
        // actually carries a new value for it (an upload bumps version;
        // a wheel zoom bumps zoom).
        let existing = {};
        try {
          existing = JSON.parse(localStorage.getItem(PICTURE_CACHE_KEY) || 'null') || {};
        } catch {
          // Harmless -- just means we can't preserve a prior version/zoom below, cachePictureLocally() still runs fine.
        }
        cachePictureLocally({
          x: posX, y: posY,
          version: extraFields.picture_version ?? existing.version,
          zoom: extraFields.image_zoom ?? existing.zoom ?? 1,
        });
      }
    }

    // ---- Vertically align the tiles column with the picture. ----
    // Left stays fixed (40px, untouched) -- only `top` moves, and it's
    // measured from the real rendered position of the picture
    // placeholder, not a guessed pixel value, so "Insider Edge" always
    // lands on the exact same horizontal line as the picture's own top
    // edge, even if the title wraps or the font hasn't loaded yet.
    // Same pattern as the original alignTilesToCards(), just re-targeted
    // at the picture now that the holding cards have moved away.
    function alignTilesToPicture() {
      const pictureTop = imagePlaceholder.getBoundingClientRect().top;
      tilesEl.style.top = `${Math.round(pictureTop)}px`;
    }
    document.fonts.ready.then(alignTilesToPicture);
    window.addEventListener('resize', alignTilesToPicture);
    window.addEventListener('load', alignTilesToPicture);
    alignTilesToPicture();
  </script>
</body>
</html>
