<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Investments — Masterboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* Same design tokens as index.html -- copied verbatim, not just
     similar, same as every other PrimeLevel tool. */
  :root {
    --navy: #1E2633;
    --white: #F9F9FA;
    --gold: #B29B68;
    --input-bg: #2A3441;
    --placeholder: #8A93A3;
    --border: #3A4453;
    --green: #4CAF7D;
    --orange: #D9A441;
    --red: #E45858;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy);
    font-family: 'Montserrat', sans-serif;
    min-height: 100%;
  }
  .container {
    max-width: 1040px;
    margin: 0 auto;
    padding: 100px 20px 80px;
  }
  /* Same h1 language as Masterboard's own title -- not a coincidence,
     "placed in the same way" per explicit request. */
  h1 {
    color: var(--gold);
    font-weight: 700;
    font-size: 60px;
    margin: 0 0 100px;
    text-align: center;
  }
  /* .back-link removed per explicit request 2026-08-26 -- deliberately
     relies on the browser's own back navigation instead now. */

  /* Investment cards -- identical to Masterboard's own, moved here
     verbatim, not redesigned. White fill, 10px radius, fixed-width
     tracks + justify-content:center so the cluster centers at its
     natural size. Modular: one card per entry in HOLDINGS. */
  .holdings {
    display: grid;
    grid-template-columns: repeat(auto-fit, 300px);
    justify-content: center;
    gap: 40px;
  }
  /* Colors switched to match Renewals' own .item exactly, per explicit
     request -- was white-fill/navy-text (the original Masterboard tile
     look), now dark input-bg fill/white text/a real border, same as
     every renewal row. Hover swap (border-color white, scale 1.015) and
     border are also copied verbatim from Renewals' .item.row-hovered,
     not just similarly styled. */
  .holding-card {
    background: var(--input-bg);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    /* height 600px, per explicit follow-up request (was 300px, itself a
       fix from the original content-driven ~139px). */
    height: 600px;
    cursor: pointer;
    text-align: left;
    font-family: 'Montserrat', sans-serif;
    transition: border-color 0.15s ease, transform 0.1s ease;
    /* Now a real container for two mutually-exclusive views (display vs
       edit), same "one surface toggles in place" pattern as Renewals'
       own .item -- see buildHoldingCard() below. */
    display: flex;
    flex-direction: column;
  }
  /* Started as just the first card at 500px (was 600px) to compare
     side by side; extended to all three, then grown to 507px on
     2026-09-02 once all three converged on identical demo styling --
     507px is what's needed for Position's own bottom to sit exactly
     100px from the card's true bottom, matching the two gaps above it
     (see .holding-price-row / .holding-position-row below). No longer
     exploratory -- all three cards are now the single, locked design. */
  .holdings .holding-card {
    /* 507px -> 510px, 2026-09-02, per explicit request: the leftover
       gap from Position's own bottom to the card's true bottom edge
       (was 97px, pure leftover space) rounded up to a clean 100px,
       matching the two 100px "main lines" gaps above it. Position's
       own top is a fixed absolute value (unaffected by card height),
       so growing the card by exactly the shortfall (+3px) lands this
       gap on 100px with no other change needed. */
    height: 510px;
    /* Positioning context for the price-row's own absolute centering
       below -- needed so top:50% resolves against THIS card's box,
       not some further-out ancestor. */
    position: relative;
    /* padding-top/left only (right/bottom untouched, still 18px like
       every other card) -- top serves BOTH the front's card-top-to-title
       distance AND the edit panel's own card-top-to-"Ticker" distance
       at once, since both sit as the very first thing inside this same
       padding box. Paired with the edit panel's own padding-top being
       zeroed for this card specifically (see .holding-edit-panel
       override below) so the two don't stack into 100px. Trimmed
       50px -> 49px, 2026-09-02, per explicit request to bring both of
       those shared distances from 51px down to exactly 50px, matching
       Delete's own bottom anchor at the same 50px (see
       .holding-edit-panel below). One value change here covers BOTH
       the front-view ticker gap and the edit-panel label gap at once,
       since they've shared this same padding-top all along. */
    padding-top: 49px;
    /* padding-left REMOVED, per direct follow-up: with the ticker/price/
       position text now required to be genuinely centered (equal left
       and right padding), the earlier 50px-left-only override directly
       conflicted with that -- centered text within a lopsided box still
       looks off-center on screen (measured live: 51px left vs 19px
       right). Reverting left/right to the same 18px every other card
       already uses is the simplest symmetric fix; card width is
       unaffected either way since box-sizing:border-box already
       guarantees padding never changes the fixed 300px outer width. */
  }
  .holdings .holding-card .holding-edit-panel {
    padding-top: 0;
    /* Bottom padding trimmed 42px -> 32px, 2026-09-01, to make Delete's
       own distance from the card's true bottom match the top's
       measured 51px (card-top to "Ticker" label) exactly -- measured
       live at 61px before this fine-tune, needed -10px. Trimmed once
       more, 32px -> 31px, 2026-09-02, matching the top's own move from
       51px to 50px (see padding-top above) -- fine-tuned by
       measurement both times, not guessed. */
    padding-bottom: 31px;
  }
  .holding-card:hover {
    border-color: var(--white);
    transform: scale(1.015);
  }
  .holding-card:active {
    transform: scale(0.98);
  }
  .holding-ticker {
    color: var(--white);
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 2px;
  }
  .holding-name {
    color: var(--white);
    opacity: 0.6;
    font-size: 13px;
    margin-bottom: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Two stacked numbers now, not one -- per explicit request: line 3 is
     the instrument's own live price per unit, line 4 is the position's
     total value (price x units). Both still show "--" until a real
     price source is wired up -- a position value computed from a fake
     price would be actively misleading, not just incomplete. (The
     on-card "placeholder — live price not wired yet" note that used to
     say this explicitly was deleted per explicit request, 2026-09-01.) */
  .holding-price-row {
    margin-bottom: 10px;
    /* Was only on the first card's own override below -- moved here,
       2026-09-01, when the placeholder note (which used to be the
       margin-top:auto anchor for every OTHER card) was deleted
       entirely. Without this, MSFT/NVDA's price+position block would
       just sit under the name instead of staying pinned to the card's
       bottom. */
    margin-top: auto;
  }
  .holding-price-label,
  .holding-position-label {
    color: var(--placeholder);
    font-size: 11px;
    margin-bottom: 1px;
  }
  .holding-price {
    color: var(--white);
    font-weight: 700;
    font-size: 22px;
  }
  .holding-position {
    color: var(--white);
    font-weight: 700;
    font-size: 22px;
  }
  /* First card only, per explicit request: name-to-price and price-to-
     position gaps stay 50px (were 14px/10px originally); ticker, price,
     and position bumped from 20px to 25px (still bold); ticker/price/
     position and their own labels all centered (were left-aligned,
     the page-wide default) -- the 50px gap between the two groups is
     unaffected by centering, since that's a margin on the group as a
     whole, not an alignment of what's inside it. Price/position's own
     JS-side element order was also swapped (value before its label,
     see buildDisplayView) so the small label text now sits BELOW its
     value instead of above it -- text-align:center here is what keeps
     both correctly centered under the now-larger value above them. */
  .holdings .holding-card .holding-name {
    margin-bottom: 50px;
  }
  /* Price row's position, 2026-09-02 -- now identical on all three
     cards after several rounds of iteration: started genuinely centered
     at the card's true middle (top:50% + translateY(-50%)), then
     AAPL/NVDA-only got a fixed top instead to close the Name-to-Price
     gap to exactly 100px (measured live: was 225px centered, 208px hits
     the target). Extended to MSFT too, 2026-09-02, once all three
     converged on one identical design -- MSFT no longer stays centered.
     position:absolute takes Price fully out of the flex flow, so its
     position is independent of Name/Position's own heights. left/right
     match the card's own 18px padding so the centered text still lines
     up with everything else. */
  .holdings .holding-card .holding-price-row {
    position: absolute;
    /* Fine-tuned 208px -> 207px, 2026-09-02, after live measurement
       showed the Name-to-Price gap landing at 101px, 1px over target.
       Position row's own top (below) moved the same -1px in lockstep
       to hold its own 100px gap to Price exactly. */
    top: 207px;
    left: 18px;
    right: 18px;
    margin: 0;
  }
  /* Position's own row wrapper (mirrors priceRow), 2026-09-01 -- a
     bare, unstyled div by default so non-demo cards (NVDA) render
     exactly as before wrapping was introduced (just one extra neutral
     block level, no visual change). Demo cards get an absolute `top`
     override below, computed from a clean live measurement -- NOT a
     fixed margin-top while still flex-flow, which was tried first and
     found to be a real bug: see the JS comment above buildDisplayView's
     positionRow for the full story (flexbox silently shrank Name to
     2px to make room, because its overflow:hidden makes its flex
     "automatic minimum size" 0 per spec). */
  /* Position row's top, 2026-09-02 -- now identical on all three cards.
     Was fine-tuned to 389px when Price was still centered and every
     card shared the same 30px Price/Position font; once Price moved to
     a fixed top (208px, above) and Price/Position dropped to 25px, this
     needed its own re-measurement to keep the mutual 100px gap to Price
     -- landed at 357px. Extended from AAPL/NVDA-only to all three,
     2026-09-02, once MSFT converged on the same design. */
  .holdings .holding-card .holding-position-row {
    position: absolute;
    left: 18px;
    right: 18px;
    /* 357px -> 359px, 2026-09-02, extended from AAPL-only to all three
       cards once MSFT/NVDA converged on the same 2px value-to-label
       gap (below) -- +2px compensates for Price row growing 2px taller,
       keeping the Price-to-Position "main lines" gap exactly 100px on
       all three. Fine-tuned once more, 359px -> 358px, 2026-09-02, in
       lockstep with Price row's own -1px fix above -- keeps this gap
       exactly 100px still. */
    top: 358px;
  }
  /* 2px gap between each value and its own label directly below it
     ($250.00 to "Price per unit", $5000.00 to "Position (...)") --
     matching the ticker-to-name 2px gap. Started AAPL-only, extended to
     all three cards, 2026-09-02, once MSFT/NVDA converged on the same
     design. */
  .holdings .holding-card .holding-price,
  .holdings .holding-card .holding-position {
    margin-bottom: 2px;
  }
  /* Ticker, 30px on all three cards. Was briefly bumped to 35px on
     AAPL only (2026-09-02), then explicitly reverted so all three
     genuinely match again. */
  .holdings .holding-card .holding-ticker {
    font-size: 30px;
  }
  /* Ticker and Company name colored gold (var(--gold), same #B29B68 as
     the "Investments" page title) -- started AAPL-only, extended to all
     three cards, 2026-09-02, once MSFT/NVDA converged on the same
     design. Company name's own existing opacity (0.6, from the base
     .holding-name rule) is left alone throughout, not reset to 1. */
  .holdings .holding-card .holding-ticker,
  .holdings .holding-card .holding-name {
    color: var(--gold);
  }
  /* "Apple Inc." font-weight was briefly bumped to bold (700) on AAPL
     only, 2026-09-02, then explicitly reverted back to normal (400) --
     the override is removed entirely rather than set back to 400
     explicitly, so it just falls back to the base .holding-name rule,
     matching MSFT/NVDA exactly again. */
  /* A thin 2px gold divider line was briefly added in the Name-to-Price
     gap on AAPL only, 2026-09-02, then removed entirely per explicit
     follow-up request -- no divider on any card now. */
  /* Price/Position value size, 25px on all three cards. Was briefly
     bumped to 30px on AAPL only (2026-09-02), then explicitly reverted
     back to match MSFT/NVDA exactly -- the user asked for "30, matching
     Microsoft and Nvidia," but MSFT/NVDA were actually at 25px, not 30,
     at the time; reverting AAPL back to this same shared rule (rather
     than a literal 30px) is what genuinely matches them, confirmed
     live. The 2px value-to-own-label gaps (set via margin-bottom on
     .holding-price/.holding-position, unrelated to font-size) and the
     359px Position row top (tuned for this exact 25px + 2px-gap
     combination) both still apply correctly now that AAPL is back to
     the same font size they were calibrated for. */
  .holdings .holding-card .holding-price,
  .holdings .holding-card .holding-position {
    font-size: 25px;
  }
  .holdings .holding-card .holding-name,
  .holdings .holding-card .holding-price-label,
  .holdings .holding-card .holding-position-label {
    font-size: 15px;
  }
  .holdings .holding-card .holding-ticker,
  .holdings .holding-card .holding-name,
  .holdings .holding-card .holding-price-row,
  .holdings .holding-card .holding-price-label,
  .holdings .holding-card .holding-price,
  .holdings .holding-card .holding-position-label,
  .holdings .holding-card .holding-position {
    text-align: center;
  }
  /* "Ticker not found" / "Not supported by KuCoin" state, 2026-09-02 --
     per explicit request: a ticker (crypto or stock) that genuinely
     doesn't price used to render as the exact same plain "--" as
     "hasn't loaded yet", indistinguishable from a real bug. One shared
     class for both -- see applyPriceDisplay's own comment for how the
     message text itself differs by ticker type. Mirrors this project's
     own established red/15px/centered error-text styling
     (.holding-edit-error, .add-error) exactly, rather than inventing a
     new one. Extra .holding-card/.holding-price/.holding-position
     class repetition (4 classes total) is deliberate, not accidental
     -- needed to outrank the 25px/bold rule just above by specificity,
     since a plain 2-class ".holding-price.unsupported" would lose to
     it regardless of source order. */
  .holdings .holding-card .holding-price.unsupported,
  .holdings .holding-card .holding-position.unsupported {
    color: var(--red);
    font-size: 15px;
    font-weight: 400;
  }
  /* Edit panel -- opened by clicking the card, replaces its normal
     display content in place (same interaction model as Renewals' own
     .edit-panel). Renewals' own layout was horizontal (fields, then
     Save/Delete, side by side in one wide row); this is the same
     colors/sizing/terminology turned VERTICAL to fit a narrow 300px
     card, per explicit request -- centered, same 16px/20px padding
     Renewals' own .item uses, same 8px gap language as its
     .edit-actions group. */
  /* Two independent fixed anchors -- card-top-to-"Ticker" AND
     Delete-button-bottom-to-card-bottom both exactly 100px -- with
     flexible content in between that can change height without
     disturbing either one. Padding alone can't do this: it only pins
     ONE end reliably (the top) while leftover space from a
     shorter-than-available content block lands somewhere ambiguous
     depending on justify-content -- confirmed live, twice, hitting two
     different wrong numbers (148px stray gap with height:100% +
     flex-start; then 230px+ once height:100% was removed and the panel
     no longer reached the card's true bottom edge at all). The correct,
     standard fix: keep height:100% so the panel's own box always spans
     the card's full inner height (guaranteeing SOMETHING reaches the
     true bottom edge), and use `margin-top: auto` on the element that
     should anchor to the bottom (Save, see the JS below) -- an auto
     margin on a flex child absorbs ALL leftover space at exactly that
     point, pushing everything from there onward (Save, Delete, the
     note) down to sit flush against padding-bottom, regardless of how
     tall the fields above happen to be. */
  .holding-edit-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    gap: 8px;
    padding: 82px 20px 42px;
  }
  /* Field colors/sizing are Renewals' .edit-panel input, verbatim --
     background, border, radius, font-size, padding all identical.
     width:100% (not Renewals' fixed 276px) since this column is much
     narrower and everything needs to line up under each other, not
     sit in a wide horizontal row. Text stays LEFT-aligned (the
     default) rather than centered, even though the surrounding layout
     is centered -- centering EDITABLE variable-length text creates
     real typing friction (the cursor position drifts on every
     keystroke), an already-learned lesson on this project, not a new
     design opinion. */
  .holding-edit-panel input {
    background: var(--navy);
    border: 1px solid var(--border);
    /* 6px -> 10px, 2026-09-02, per explicit request. Base rule, shared
       by all three cards -- one change covers all of them. */
    border-radius: 10px;
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    padding: 6px 8px;
    outline: none;
    width: 100%;
  }
  /* Removes the native up/down spinner arrows on the Units field (type=
     "number"), per explicit request -- Firefox via appearance:textfield
     on the input itself, Chrome/Safari via their own vendor-prefixed
     pseudo-elements (the input still accepts typed numbers and its own
     min/step validation exactly as before, only the visible arrows are
     gone). */
  .holding-edit-panel input[type="number"] {
    appearance: textfield;
    -moz-appearance: textfield;
  }
  .holding-edit-panel input[type="number"]::-webkit-outer-spin-button,
  .holding-edit-panel input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .holding-edit-panel input::placeholder {
    color: var(--placeholder);
  }
  /* Button colors/sizing are Renewals' .edit-save-btn, verbatim --
     transparent fill, white outline, 0.45 resting opacity, same
     hover/active swap. width:100% (not Renewals' fixed 90px) for the
     same reason as the inputs above -- a uniform-width stacked column
     reads as centered, a small button under full-width inputs
     wouldn't. */
  .holding-edit-panel button {
    width: 100%;
    text-align: center;
    background: transparent;
    border: 1px solid var(--white);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 15px;
    /* 6px -> 10px, 2026-09-02, per explicit request -- now matches the
       input fields' own 10px, so every rounded corner in the edit
       panel is the same radius. */
    border-radius: 10px;
    padding: 6px 12px;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  /* :not(:disabled) added 2026-09-02, alongside the new Save/Delete
     loading state -- without it, a disabled button (mid-request) could
     still show its hover/active brightening if the cursor happened to
     sit over it, misleadingly implying it's still interactive when a
     disabled button in fact receives no pointer events at all. */
  .holding-edit-panel button:hover:not(:disabled) {
    opacity: 1;
    background: var(--white);
    color: var(--navy);
    transform: scale(1.02);
  }
  .holding-edit-panel button:active:not(:disabled) {
    transform: scale(0.96);
  }
  .holding-edit-panel button:disabled {
    cursor: not-allowed;
  }
  .holding-edit-label {
    color: var(--placeholder);
    font-size: 11px;
    align-self: flex-start;
    margin-bottom: -4px;
  }
  /* Ticker/Company name/Units labels bumped 11px -> 15px, matching the
     input values' own 15px size, 2026-09-02 -- now on all three cards
     (started AAPL/NVDA-only, extended to MSFT once all three converged
     on one identical design). Left-alignment with the navy input boxes
     below needed no change -- confirmed live beforehand that
     align-self:flex-start already puts both at the exact same left
     edge, font-size doesn't affect that. */
  .holdings .holding-card .holding-edit-label {
    font-size: 15px;
  }
  /* Every internal gap in the edit panel bumped up from the panel's
     shared base (label-to-own-input 4px -> 5px, input-to-next-label 8px
     -> 10px, Save-to-Delete 8px -> 10px), while the two OUTER anchors
     (card-top-to-Ticker, Delete-bottom-to-card-bottom) stay locked at
     exactly 50px -- everything in between just absorbs a little less of
     the panel's own leftover auto-space (currently ~149px slack before
     Save) to make room, verified live afterward. Started AAPL-only,
     extended to MSFT/NVDA on the same day once the user saw it and
     asked for all three to match. The panel's own `gap: 8px` is the
     shared baseline every adjacent pair already gets; these are
     ADDITIVE margins on top of that gap, not replacements for it:
     - label's own -4px margin-bottom (8-4=4 baseline) becomes -3px
       (8-3=5) -- see .holding-edit-label's own -4px above.
     - a NEW +2px margin-bottom on every input (8+2=10) closes the
       input-to-next-label gap. Harmless on the 3rd (Units) input too --
       that gap is absorbed into Save's own huge auto-space regardless.
     - a NEW +2px margin-top specifically on the 2nd button (Delete,
       via :nth-of-type since Save/Delete share one class) closes the
       Save-to-Delete gap (8+2=10) without touching Save's own existing
       margin-top:auto (a different property, no conflict). */
  .holdings .holding-card .holding-edit-label {
    margin-bottom: -3px;
  }
  .holdings .holding-card .holding-edit-panel input {
    margin-bottom: 2px;
  }
  .holdings .holding-card .holding-edit-panel button:nth-of-type(2) {
    margin-top: 2px;
  }
  /* NOTE: MSFT briefly had its own -18px offset here (pulling just the
     "Ticker" label up so its navy input box sat at 51px from the card
     top, deliberately different from AAPL/NVDA's 69px, for a live
     side-by-side comparison) -- removed 2026-09-02 once the user chose
     to make all three cards identical on that point too, landing on
     AAPL/NVDA's original (unoffset) 69px for all three. */
  /* Was a static "Live ticker<->name lookup..." info note shown at all
     times; deleted entirely per explicit request, 2026-09-01. The div
     itself is kept (renamed to reflect its real remaining purpose) --
     it was also doing double duty as the Save/Delete failure message,
     which still needs somewhere to render. display:none by default so
     it reserves zero space normally (an empty-but-visible div would
     still reserve its own line-height -- see the standing lesson in
     webapp-frontend-methodology); .visible shown only on a real error,
     same pattern as .add-error below. */
  .holding-edit-error {
    display: none;
    color: var(--red);
    font-size: 15px;
    text-align: center;
    margin-top: 4px;
  }
  .holding-edit-error.visible {
    display: block;
  }

  .empty-state {
    color: var(--placeholder);
    font-size: 20px;
    text-align: center;
    padding: 40px 0;
  }

  /* ==========================================================
     "Add a holding" mechanism -- the TRIGGER (circle) and its whole
     timer/dismiss state machine are still mirrored from Renewals' own
     proven implementation, untouched. The POPOVER's own internal
     content was completely rebuilt 2026-09-02, per explicit request:
     was a horizontal bar (fields side by side + Save), now it's a
     vertical card that mirrors a real holding card's OWN edit mode
     exactly -- same colors/padding/fonts/gaps, just without a Delete
     button (nothing to delete for a brand-new entry) and with Save
     landing where Delete currently sits (50px from the card's own
     bottom), per explicit request ("mirror it with one difference").
     ========================================================== */
  .add-wrapper {
    margin-top: 100px;
    /* 100px -> 40px, 2026-09-02, per explicit request: the gap from the
       add-card down to the first real holding card below it should
       match the holdings grid's own inter-card gap (40px, the locked
       layout spec), not the site's separate 100px title-rhythm value. */
    margin-bottom: 40px;
    padding-top: 2px;
    padding-bottom: 2px;
    /* 260px -> 600px, 2026-09-02 -- the popover now holds a full
       510px-tall card (see .add-popover-inner below) instead of a
       ~50px horizontal bar. Must fit: padding-top(2) + trigger(56) +
       popover margin-top(12) + popover's own open max-height(520) +
       padding-bottom(2) = 592px needed. A too-small cap here silently
       clips the wrapper's own box (even though overflow:hidden still
       *paints* the overflowing card, since the browser only clips at
       the wrapper's true box edge) -- an earlier 560px value was 32px
       short and ate into the 40px margin-bottom gap below, shrinking
       the real on-screen gap to the holdings grid to ~20px. Verified
       live via getBoundingClientRect() after this fix. */
    max-height: 600px;
    overflow: hidden;
    transition: max-height 0.25s ease, margin-bottom 0.25s ease;
  }
  .add-wrapper.idle-hidden {
    max-height: 0;
    margin-bottom: 0;
  }
  .add-trigger {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 0.5px solid var(--white);
    background: transparent;
    color: var(--white);
    font-size: 31px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    opacity: 0.45;
    user-select: none;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .add-trigger:hover {
    opacity: 1;
    background: var(--white);
    color: var(--navy);
    transform: scale(1.03);
  }
  .add-trigger:active { transform: scale(0.94); }
  .add-wrapper.idle-hidden .add-trigger {
    opacity: 0;
  }
  .add-popover {
    max-height: 0;
    margin-top: 0;
    opacity: 0;
    overflow: hidden;
    /* Centered, same as the trigger circle above it -- the popover
       itself has no fixed width, but its one child (.add-popover-inner,
       a real 300px card) centers via margin:0 auto, same principle. */
    display: flex;
    justify-content: center;
    transition: max-height 0.25s ease, margin-top 0.25s ease, opacity 0.2s ease;
  }
  .add-popover.open {
    /* 160px -> 520px, 2026-09-02, matching the new card's real 510px
       height plus a small safety margin. */
    max-height: 520px;
    margin-top: 12px;
    opacity: 1;
  }
  /* Rebuilt 2026-09-02 to mirror .holding-card's own edit-mode
     appearance EXACTLY -- same background/border/radius/size/padding
     as a real card. These values are intentionally DUPLICATED from
     .holding-card's own resolved styling (300px wide, 510px tall,
     padding 49px 18px 18px 18px -- see .holding-card above, now a
     single unscoped rule applying to every card) rather than inherited
     via shared selectors, since this element lives outside .holdings
     and can't naturally match those rules. If the real cards' edit-mode
     styling changes again, this needs updating to match. */
  .add-popover-inner {
    width: 300px;
    height: 510px;
    background: var(--input-bg);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 49px 18px 18px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  /* Mirrors .holding-edit-panel exactly (same duplication reasoning as
     above) -- flex column, height:100% so Save's own margin-top:auto
     (set inline in JS, matching the real Save button) can push it down
     to sit flush with padding-bottom, landing at the same 50px-from-
     card-bottom spot Delete currently occupies on a real card, since
     Save is now the only button in this flow. */
  .add-form {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    gap: 8px;
    padding: 0 20px 31px;
  }
  /* Mirrors .holding-edit-label exactly, including its 2026-09-02 size/
     gap bump (11px->15px, -4px->-3px margin) -- duplicated here for the
     same ancestor-scoping reason as above. */
  .add-form label {
    color: var(--placeholder);
    font-size: 15px;
    align-self: flex-start;
    margin-bottom: -3px;
  }
  /* Mirrors .holding-edit-panel input exactly, including its 2px
     margin-bottom bump. */
  .add-form input {
    background: var(--navy);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    padding: 6px 8px;
    outline: none;
    width: 100%;
    margin-bottom: 2px;
  }
  .add-form input[type="number"] {
    appearance: textfield;
    -moz-appearance: textfield;
  }
  .add-form input[type="number"]::-webkit-outer-spin-button,
  .add-form input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .add-form input::placeholder { color: var(--placeholder); }
  /* Mirrors .holding-edit-panel button exactly -- same colors, 10px
     radius, hover/active/disabled states (including the same
     :not(:disabled) guard the real Save/Delete buttons use, now that
     this Save gets the identical instant-loading-state treatment). */
  .add-save-btn {
    width: 100%;
    text-align: center;
    background: transparent;
    border: 1px solid var(--white);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 15px;
    border-radius: 10px;
    padding: 6px 12px;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .add-save-btn:hover:not(:disabled) {
    opacity: 1;
    background: var(--white);
    color: var(--navy);
    transform: scale(1.02);
  }
  .add-save-btn:active:not(:disabled) {
    transform: scale(0.96);
  }
  .add-save-btn:disabled {
    cursor: not-allowed;
  }
  /* Mirrors .holding-edit-error exactly -- hidden by default (an empty
     but visible div would still reserve its own line-height), shown
     only on a real save failure. */
  .add-error {
    display: none;
    color: var(--red);
    font-size: 15px;
    text-align: center;
    margin-top: 4px;
  }
  .add-error.visible {
    display: block;
  }
</style>

<body>
  <div class="container">
    <h1>Investments</h1>

    <div class="add-wrapper">
      <button class="add-trigger" id="addTrigger" title="Add a holding">+</button>
      <div class="add-popover" id="addPopover">
        <div class="add-popover-inner">
          <div class="add-form">
            <label for="newHoldingTicker">Ticker</label>
            <input id="newHoldingTicker" type="text" placeholder="e.g. AAPL" autocomplete="off" />
            <label for="newHoldingName">Company name</label>
            <input id="newHoldingName" type="text" placeholder="e.g. Apple Inc." autocomplete="off" />
            <label for="newHoldingUnits">Units</label>
            <input id="newHoldingUnits" type="number" min="0" step="any" placeholder="0" autocomplete="off" />
            <button id="addHoldingBtn" class="add-save-btn" type="button">Save</button>
            <div class="add-error" id="addHoldingError"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="holdings" id="holdings"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // Same Supabase project every other PrimeLevel tool uses -- same
    // URL/key pattern as index.html/insider-edge.html.
    const SUPABASE_URL = 'https://kenlhcatkjthhzuaznpg.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_-gt5PPGL45s3hRsfOosH6g_q3yP-b-_';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    // Edge Function proxying Finnhub's free-tier quote endpoint -- see
    // its own source (supabase/functions/get-quotes) for the full
    // reasoning. Keeps the Finnhub API key server-side (a Supabase
    // secret), never in this page's own client-side JS.
    const QUOTES_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/get-quotes`;

    const holdingsEl = document.getElementById('holdings');
    let holdings = [];
    // ticker -> last known live price (number) or null (no price
    // available yet, or Finnhub couldn't price that symbol). Persists
    // across renderHoldings() rebuilds (e.g. opening a card's edit
    // panel) so those don't blank out prices already fetched --
    // buildDisplayView reads from this directly instead of always
    // starting at "--".
    let livePrices = {};
    // holding.id -> { priceEl, positionEl }, repopulated on every
    // renderHoldings() call -- lets refreshPrices() update the numbers
    // already on screen in place, without a full re-render (which would
    // otherwise blow away focus/scroll and, worse, any OTHER card's open
    // edit panel elsewhere in the list).
    let displayEls = new Map();
    // A Set, not a single id -- per explicit request, mirroring
    // Renewals' real behavior (confirmed directly from its own code,
    // not assumed): opening one item's edit panel does NOT close any
    // other already-open one. Each card only ever closes via its own
    // explicit Save or Delete. There is deliberately no inactivity
    // timer here -- confirmed Renewals doesn't have one for existing-
    // item edit panels either (every setTimeout in that file belongs
    // only to the "+" add-new popover), so none was invented here.
    let editingIds = new Set();

    // ==========================================================
    // "Add a holding" mechanism -- mirrored from Renewals' own "+"
    // trigger/popover/idle-hide system, per explicit request. The
    // whole state machine (two separate timers, the click-outside
    // race-condition fix) is copied faithfully from Renewals' own
    // already-debugged implementation -- see its own comments for
    // the full reasoning behind each piece; only reproduced here,
    // not re-derived. ==========================================================
    const addTrigger = document.getElementById('addTrigger');
    const addWrapper = document.querySelector('.add-wrapper');
    const addPopover = document.getElementById('addPopover');
    const addPopoverInner = document.querySelector('.add-popover-inner');
    const newTickerInput = document.getElementById('newHoldingTicker');
    const newNameInput = document.getElementById('newHoldingName');
    const newUnitsInput = document.getElementById('newHoldingUnits');
    const addHoldingBtn = document.getElementById('addHoldingBtn');
    const addHoldingError = document.getElementById('addHoldingError');
    // margin-top:auto -- same trick the real Save button uses inline:
    // absorbs all leftover vertical space right here, pushing Save (now
    // the last thing in the form, no Delete after it) down to sit flush
    // against the form's own padding-bottom -- lands at the same 50px-
    // from-card-bottom spot Delete occupies on a real card.
    addHoldingBtn.style.marginTop = 'auto';

    function setAddError(message) {
      addHoldingError.textContent = message;
      addHoldingError.classList.toggle('visible', !!message);
    }

    // The "+" trigger never moves -- opening the popover never shifts it.
    // Auto-closes after 60s of inactivity so it doesn't sit open forever
    // if you got distracted mid-entry, and closes on any click outside it
    // too (see the document mousedown listener further down).
    let collapseTimer = null;
    function closeAddPopover() {
      addPopover.classList.remove('open');
      newTickerInput.value = '';
      newNameInput.value = '';
      newUnitsInput.value = '';
      setAddError('');
      // Reset Save's own loading state too, 2026-09-02 -- otherwise a
      // successful save (which calls this via the success path) would
      // leave the button disabled/"Saving..." the NEXT time the
      // popover is reopened, since the button itself isn't recreated,
      // only hidden and shown again.
      addHoldingBtn.disabled = false;
      addHoldingBtn.textContent = 'Save';
      clearTimeout(collapseTimer);
    }
    function resetCollapseTimer() {
      clearTimeout(collapseTimer);
      collapseTimer = setTimeout(() => {
        closeAddPopover();
        // The whole page has been idle long enough that even the OPEN
        // form gave up and closed -- the "+" trigger shouldn't then wait
        // out its own separate 30s countdown on top of that, it should
        // disappear immediately alongside the form.
        hideTriggerNow();
      }, 60000);
    }

    // Real behavioral gap found and fixed 2026-09-02, per explicit
    // request to match Renewals' own new-item form exactly: Renewals
    // resets its 60s auto-close timer on every keystroke/focus in its
    // fields, not just on the initial trigger click -- Investments'
    // own fields had NONE of this, so a user genuinely still filling in
    // the (3-field, one more than Renewals' 2) form past the 60s mark
    // could have it auto-close out from under them mid-entry. Mirrored
    // verbatim from Renewals' own `nameInput`/`dateInput` 'input' and
    // 'focus' listeners.
    newTickerInput.addEventListener('input', resetCollapseTimer);
    newNameInput.addEventListener('input', resetCollapseTimer);
    newUnitsInput.addEventListener('input', resetCollapseTimer);
    newTickerInput.addEventListener('focus', resetCollapseTimer);
    newNameInput.addEventListener('focus', resetCollapseTimer);
    newUnitsInput.addEventListener('focus', resetCollapseTimer);

    // Same request: Enter moves straight to the next field, and submits
    // from the last one -- mirrored verbatim from Renewals' own
    // nameInput/dateInput keydown handlers. Calls saveNewHolding()
    // directly rather than addHoldingBtn.click() (which Renewals uses)
    // -- Investments' Save is a `mousedown` listener, not `click`, for
    // the same click/mousedown-drift reasons documented throughout this
    // project, so a synthetic .click() wouldn't actually reach it; the
    // shared save function (below) is called from both places instead.
    newTickerInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      newNameInput.focus();
    });
    newNameInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      newUnitsInput.focus();
    });
    newUnitsInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      saveNewHolding();
    });

    // mousedown, not click -- real bug found and fixed 2026-09-01. The
    // trigger has `:active { transform: scale(0.94) }`, which starts
    // shrinking the circle's own hit region the INSTANT a press lands,
    // before release. A precise, dead-center automated click never
    // notices this (the shrink is centered, so the middle point stays
    // covered) -- but a real hand pressing near the circle's EDGE, with
    // the ordinary few-pixel drift between press and release a mouse or
    // finger has, can have the release land just outside the
    // now-6%-smaller hit area. mousedown resolves the whole toggle in
    // the same synchronous instant the press lands, before any shrink
    // transition has even started -- same reasoning as every other
    // "click strands due to a layout/geometry shift mid-press" fix on
    // this project.
    addTrigger.addEventListener('mousedown', () => {
      if (addPopover.classList.contains('open')) {
        closeAddPopover();
        return;
      }
      // Pop open instantly, 2026-09-02 -- real request: the card was
      // growing/sliding down over the CSS transition's 250ms (the same
      // max-height transition that gives the wrapper's own idle-hide and
      // the outside-click-dismiss their smooth collapse), which read as
      // an unwanted "sliding from the top" reveal. The card should just
      // appear the instant the trigger is pressed. Same no-transition/
      // reflow/restore trick already used for the outside-click dismiss
      // below -- force this one open-moment to skip the transition,
      // then restore it so a later CLOSE (toggle, outside click, 60s
      // idle) still collapses smoothly, which nothing asked to change.
      addPopover.style.transition = 'none';
      addPopover.classList.add('open');
      void addPopover.offsetHeight; // force the no-transition style to actually apply
      addPopover.style.transition = '';
      newTickerInput.focus();
      resetCollapseTimer();
    });

    // Separate from the popover's own 60s auto-collapse above: the "+"
    // trigger (and the space it occupies) collapses after 30s of no
    // clicks anywhere on the page, or immediately on any click outside
    // the trigger/popover while the popover isn't open. Expands back
    // the instant anything is clicked while hidden.
    let hideTriggerTimer = null;
    function hideTriggerNow() {
      clearTimeout(hideTriggerTimer);
      addWrapper.classList.add('idle-hidden');
    }
    function scheduleTriggerHide() {
      clearTimeout(hideTriggerTimer);
      hideTriggerTimer = setTimeout(() => {
        if (!addPopover.classList.contains('open')) {
          hideTriggerNow();
        }
      }, 30000);
    }

    // Race-condition fix, mirrored exactly from Renewals: dismissing an
    // OPEN popover via an outside click collapses TWO things at once
    // (the popover's own shrink and the wrapper's own shrink), and the
    // wrapper's idle-hidden class is set instantly even though the
    // visual collapse takes ~250ms -- a follow-up click during that
    // visual tail would otherwise be read as "reveal it", undoing the
    // dismiss. wrapperIsCollapsing gates the reveal branch until the
    // wrapper's real transitionend fires, backed by a 350ms fallback
    // timer in case transitionend never fires for any reason.
    let wrapperIsCollapsing = false;
    let wrapperCollapseFallbackTimer = null;
    function clearWrapperCollapsingGate() {
      wrapperIsCollapsing = false;
      clearTimeout(wrapperCollapseFallbackTimer);
    }
    addWrapper.addEventListener('transitionend', (e) => {
      if (e.target === addWrapper && e.propertyName === 'max-height') {
        clearWrapperCollapsingGate();
      }
    });

    // mousedown, not click -- same reasoning as every other "click
    // outside to dismiss" listener on this project: immune to any
    // slight drift between mouse-down and mouse-up.
    //
    // Real bug found and fixed 2026-09-01, present in Renewals' own
    // original mechanism too (checked directly -- its .add-wrapper CSS
    // is identical, so this was copied faithfully, not introduced
    // here): .add-wrapper is a bare block element with no width set,
    // so it stretches to the FULL container width -- confirmed live,
    // 1000px wide -- even though the visible circle is only 56px of
    // that. Checking `addWrapper.contains(e.target)` therefore treats
    // any click landing anywhere in that ~470px-wide invisible band on
    // EITHER side of the circle as "inside", so it only resets the
    // idle timer instead of dismissing -- exactly matching the report
    // "close to the button it doesn't disappear, far away it does".
    // Scope the check to what's actually visible instead: the trigger
    // circle itself, or the popover's own real content when it's open
    // (its own box is 0-height while closed, so it can never match a
    // real click then).
    //
    // Same exact bug recurred one level deeper, found and fixed
    // 2026-09-02: this fix originally checked `addPopover.contains(...)`
    // -- but .add-popover ITSELF is the same kind of bare, unconstrained
    // box (display:flex, no width set), so when open it still spans the
    // FULL ~960px content width even though the real visible card
    // (.add-popover-inner) is only 300px, centered, in the middle of it.
    // A click 5cm to either side of the card was landing in that same
    // invisible band and silently swallowed as "inside" -- reported live
    // as "I click outside and nothing happens, have to click 2-3 times".
    // Scoped to .add-popover-inner (the actual 300px card) instead.
    document.addEventListener('mousedown', (e) => {
      const clickedInsideWrapper = addTrigger.contains(e.target) || addPopoverInner.contains(e.target);

      if (addWrapper.classList.contains('idle-hidden')) {
        if (wrapperIsCollapsing) return;
        addWrapper.classList.remove('idle-hidden');
        scheduleTriggerHide();
        return;
      }

      if (clickedInsideWrapper) {
        scheduleTriggerHide();
        return;
      }

      if (addPopover.classList.contains('open')) {
        addPopover.style.transition = 'none';
        closeAddPopover();
        void addPopover.offsetHeight; // force the no-transition style to actually apply
        addPopover.style.transition = '';
        wrapperIsCollapsing = true;
        clearTimeout(wrapperCollapseFallbackTimer);
        wrapperCollapseFallbackTimer = setTimeout(clearWrapperCollapsingGate, 350);
      }
      hideTriggerNow();
    });
    scheduleTriggerHide();

    // Named function, not an inline listener, 2026-09-02 -- needs to be
    // callable from two places: the button's own `mousedown` AND the
    // Units field's Enter key (see above), same as Renewals' own
    // addBtn.click()-from-Enter pattern, just adapted since this
    // project's Save buttons are `mousedown`-based, not `click`-based.
    // Same instant-loading-state fix as the real Save/Delete buttons --
    // disabled synchronously before the `await` so a second trigger
    // (another click, or hitting Enter again) can't fire a duplicate
    // insert, text swaps to "Saving...", restored on validation/save
    // failure so it's never left stuck (the success path doesn't need
    // restoring -- Save vanishes along with the whole popover on
    // success anyway).
    async function saveNewHolding() {
      setAddError('');
      const ticker = newTickerInput.value.trim().toUpperCase();
      const name = newNameInput.value.trim();
      const units = parseFloat(newUnitsInput.value) || 0;
      if (!ticker || !name) {
        setAddError('Please enter both a ticker and a company name.');
        return;
      }
      addHoldingBtn.disabled = true;
      const originalText = addHoldingBtn.textContent;
      addHoldingBtn.textContent = 'Saving...';
      const { error } = await supabase
        .from('investment_holdings')
        .insert({ ticker, name, units });
      if (error) {
        setAddError('Could not save — please check your connection and try again.');
        addHoldingBtn.disabled = false;
        addHoldingBtn.textContent = originalText;
        return;
      }
      closeAddPopover();
      await loadHoldings();
    }
    addHoldingBtn.addEventListener('mousedown', saveNewHolding);

    async function loadHoldings() {
      // Real bug found and fixed during live testing: the 3 seed rows
      // were all inserted in one batch and share the exact same
      // created_at timestamp down to the microsecond, so ordering by
      // created_at alone left their relative order undefined -- a
      // second, always-unique sort key (id) makes it deterministic.
      const { data, error } = await supabase
        .from('investment_holdings')
        .select('*')
        .order('created_at', { ascending: true })
        .order('id', { ascending: true });
      if (error) {
        holdingsEl.innerHTML = '<div class="empty-state">Could not load holdings. Please refresh.</div>';
        return;
      }
      holdings = data;
      renderHoldings();
      // Refresh on every reload -- covers the real page-load case AND
      // every mutation that already calls loadHoldings() (add/save/
      // delete), so a newly added or renamed holding gets a real price
      // immediately rather than waiting out the rest of the 60s cycle.
      // Deliberately not awaited -- rendering shouldn't block on it.
      refreshPrices();
    }

    function renderHoldings() {
      holdingsEl.innerHTML = '';
      displayEls.clear();
      if (!holdings.length) {
        holdingsEl.innerHTML = '<div class="empty-state">Nothing tracked yet.</div>';
        return;
      }
      holdings.forEach((h) => {
        holdingsEl.append(buildHoldingCard(h));
      });
    }

    // toLocaleString, not toFixed, 2026-09-02 -- real bug found and
    // fixed once live prices started flowing through real position
    // sizes: toFixed(2) alone has no thousands separator, so a genuine
    // $25,051.00 position rendered as the much harder-to-read
    // "$25051.00". en-US + explicit min/max fraction digits locks the
    // format to exactly 2 decimal places (never 3+, never a bare whole
    // number), same as toFixed always did, just with the comma added.
    // maximumFractionDigits: 6 (was a fixed 2), 2026-09-02 -- real bug
    // found and reported live: WILD-USDT's actual KuCoin price,
    // $0.01511, was rounding to a flat "$0.02" -- correct arithmetic
    // for 2 decimal places, but a ~33% distortion for a token priced in
    // fractions of a cent, genuinely misleading, not just imprecise.
    // toLocaleString only uses as many decimals as a number actually
    // has, up to the max -- it never PADS extra trailing zeros beyond
    // minimumFractionDigits, so this is a strict precision improvement
    // for small numbers with zero effect on normal-range ones:
    // 325.13 -> still "325.13" (unchanged), 25051 -> still "25,051.00"
    // (unchanged), but 0.01511 -> "0.01511" (was "0.02"). Applies to
    // every holding, not just crypto -- a cheap penny stock would hit
    // the exact same rounding problem.
    function formatMoney(n) {
      return n == null ? '—' : `$${n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 6 })}`;
    }

    // A ticker containing "-" (e.g. "WILD-USDT") is a crypto pair,
    // looked up on KuCoin specifically -- see the Edge Function's own
    // comment for the full reasoning (and the real bare-"BTC"-collides-
    // with-an-unrelated-ETF bug that made the "-USDT" suffix mandatory
    // in the first place).
    function isCryptoTicker(ticker) {
      return ticker.includes('-');
    }

    // Sets the Price/Position text (and the "unsupported" styling) for
    // one holding, shared between buildDisplayView's initial render and
    // refreshPrices' live update below so the two can never drift out
    // of sync with each other.
    //
    // Real UX gap found and fixed 2026-09-02, per explicit request: a
    // crypto ticker KuCoin genuinely doesn't list used to render as the
    // exact same plain "--" as "hasn't fetched yet" -- indistinguishable
    // from a real bug, no way to tell "wrong ticker" from "still
    // loading" apart. The key: livePrices[ticker] is `undefined` before
    // the FIRST refreshPrices() call ever completes for this ticker
    // (still loading -- stays a plain "--", correctly, so a normal page
    // load doesn't flash an error for an instant), but explicitly
    // `null` once a real fetch has completed and genuinely found
    // nothing (Finnhub's own quotes object always sets every requested
    // ticker's key, never omits one -- see the Edge Function). Reading
    // the raw value directly here, not through `?? null`, is what keeps
    // that distinction alive; `?? null` would collapse both cases to
    // the same thing.
    //
    // Extended 2026-09-02, per explicit follow-up request, to cover an
    // unmatched STOCK ticker too -- was still a plain "--" until now,
    // same reasoning as the crypto case: a red, explicit "Ticker not
    // found" is more honest than a blank dash that looks identical to
    // "hasn't loaded yet" or a genuine $0 position. Different wording
    // per case (crypto names KuCoin specifically, since that's the one
    // real exchange this app ever checks; a stock isn't tied to one
    // named source the same way) but identical styling -- both route
    // through the same .unsupported class.
    function applyPriceDisplay(ticker, units, priceEl, positionEl) {
      const price = livePrices[ticker];
      const notFound = price === null;
      const message = notFound ? (isCryptoTicker(ticker) ? 'Not supported by KuCoin' : 'Ticker not found') : null;
      priceEl.textContent = message ?? formatMoney(price ?? null);
      priceEl.classList.toggle('unsupported', notFound);
      positionEl.textContent = message ?? formatMoney(price != null ? price * units : null);
      positionEl.classList.toggle('unsupported', notFound);
    }

    // Real bug found and fixed 2026-09-02: adding a genuine 4th holding
    // via the "+" card exposed that this function used to fork on a
    // `demoIndex` for LAYOUT (label wording, value-before-label DOM
    // order) as well as for the price source -- so a real new card
    // rendered with old long labels, label-first order, and none of the
    // now-universal CSS (see .holding-card above, no longer
    // :nth-child(-n+3)-scoped) lined up with it. Layout is now
    // unconditional for every card. The number source is ALSO now
    // unconditional, 2026-09-02: live pricing is wired up for real (a
    // Finnhub-backed Edge Function, see QUOTES_FUNCTION_URL/
    // refreshPrices below) -- the 3 original holdings' old hardcoded
    // DEMO_PRICE_POSITION numbers are gone, every holding, old or new,
    // shows its own real price now.
    function buildDisplayView(card, holding) {
      const ticker = document.createElement('div');
      ticker.className = 'holding-ticker';
      ticker.textContent = holding.ticker;

      const name = document.createElement('div');
      name.className = 'holding-name';
      name.textContent = holding.name;

      const priceRow = document.createElement('div');
      priceRow.className = 'holding-price-row';
      const priceLabel = document.createElement('div');
      priceLabel.className = 'holding-price-label';
      priceLabel.textContent = 'Price';
      const price = document.createElement('div');
      price.className = 'holding-price';
      priceRow.append(price, priceLabel);

      const positionLabel = document.createElement('div');
      positionLabel.className = 'holding-position-label';
      positionLabel.textContent = 'Position';
      const position = document.createElement('div');
      position.className = 'holding-position';
      // Reads whatever's already cached in livePrices (from a previous
      // refresh) rather than always starting blank -- so rebuilding
      // this card (e.g. because some OTHER card's edit panel just
      // opened/closed, which re-renders the whole list) doesn't wipe
      // out a price already fetched a moment ago.
      applyPriceDisplay(holding.ticker, holding.units, price, position);

      // Wrapped in its own row div (mirroring priceRow), 2026-09-01 --
      // needed so the group can be positioned with a single absolute
      // `top`, rather than fighting flexbox over it. (A first attempt
      // used a plain fixed margin-top on the bare .holding-position
      // element while it was still a flex-flow sibling -- real bug
      // found live: that fixed margin, combined with .holding-name's
      // overflow:hidden making its flex "automatic minimum size" 0 per
      // spec, made flexbox silently shrink Name down to 2px tall to
      // make everything else fit, rather than anything visibly
      // erroring. Taking Position out of the flow entirely, same as
      // Price, sidesteps that whole class of bug.)
      const positionRow = document.createElement('div');
      positionRow.className = 'holding-position-row';
      positionRow.append(position, positionLabel);
      card.append(ticker, name, priceRow, positionRow);
      displayEls.set(holding.id, { priceEl: price, positionEl: position });
    }

    // Refreshes live prices for every current holding in one batched
    // call to the Edge Function (one HTTP round trip regardless of how
    // many holdings there are, rather than one per ticker), then
    // updates the DOM directly for whichever cards are currently in
    // display mode -- NOT via renderHoldings(), so a card someone has
    // open for editing elsewhere in the list is left completely alone.
    // Called once after every loadHoldings() (covers page load and
    // every add/save/delete) and on a 60s repeating timer below, per
    // explicit request -- see the chat decision on refresh cadence
    // (60 calls/minute Finnhub free-tier limit vs. holdings-count x
    // refreshes-per-minute actually used, nowhere close for any
    // realistic number of holdings).
    async function refreshPrices() {
      if (!holdings.length) return;
      const tickers = [...new Set(holdings.map((h) => h.ticker))];
      let quotes;
      try {
        const res = await fetch(`${QUOTES_FUNCTION_URL}?symbols=${tickers.join(',')}`);
        if (!res.ok) return; // leave livePrices as they were -- a failed refresh shouldn't blank out the last known prices
        quotes = await res.json();
      } catch {
        return; // network hiccup -- try again on the next 60s tick, same reasoning as above
      }
      Object.assign(livePrices, quotes);
      for (const holding of holdings) {
        const els = displayEls.get(holding.id);
        if (!els) continue; // this holding's card isn't in display mode right now (its edit panel is open) -- nothing on screen to update
        applyPriceDisplay(holding.ticker, holding.units, els.priceEl, els.positionEl);
      }
    }
    setInterval(refreshPrices, 60000);

    function buildEditView(card, holding) {
      const panel = document.createElement('div');
      panel.className = 'holding-edit-panel';
      const tickerLabel = document.createElement('div');
      tickerLabel.className = 'holding-edit-label';
      tickerLabel.textContent = 'Ticker';
      const tickerInput = document.createElement('input');
      tickerInput.value = holding.ticker;
      tickerInput.placeholder = 'e.g. AAPL';

      const nameLabel = document.createElement('div');
      nameLabel.className = 'holding-edit-label';
      nameLabel.textContent = 'Company name';
      const nameInput = document.createElement('input');
      nameInput.value = holding.name;
      nameInput.placeholder = 'e.g. Apple Inc.';

      const unitsLabel = document.createElement('div');
      unitsLabel.className = 'holding-edit-label';
      unitsLabel.textContent = 'Units';
      const unitsInput = document.createElement('input');
      unitsInput.type = 'number';
      unitsInput.min = '0';
      unitsInput.step = 'any';
      unitsInput.value = holding.units;

      // mousedown, not click -- exact same reasoning as Renewals' own
      // Save/Delete: a layout shift between mousedown and mouseup (e.g.
      // this row closing/reordering) can move the button out from under
      // the cursor before a click would fire on mouse-up. mousedown
      // resolves the action in the same synchronous pass, immune to
      // that.
      const saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.textContent = 'Save';
      // margin-top:auto -- see the .holding-edit-panel CSS comment for
      // why: absorbs all leftover vertical space right here, pushing
      // Save/Delete/the note down to sit flush against the panel's own
      // padding-bottom, so Delete's distance from the card's bottom
      // edge stays fixed regardless of how tall the fields above are.
      saveBtn.style.marginTop = 'auto';
      // Real bug found and fixed 2026-09-02: no loading-state feedback
      // existed at all here -- the button just sat there, completely
      // unchanged, for the whole Supabase round trip. On a normal-speed
      // network that's invisible; the moment the request takes even a
      // few hundred ms, it looks exactly like "did my click even
      // register?" and the natural reaction is to click again -- this
      // matches the standing "instant feedback for an async button
      // action" lesson already applied elsewhere in this project
      // (Renewals' own "Sending..." state) but never wired up here.
      // Both buttons disabled synchronously, before the `await`, so a
      // second click physically can't do anything (a disabled button
      // doesn't receive mousedown at all) instead of firing a second,
      // redundant request. Restored on failure so it's never left
      // stuck; the success path doesn't need restoring since
      // loadHoldings() rebuilds the card fresh from scratch anyway.
      saveBtn.addEventListener('mousedown', async () => {
        saveBtn.disabled = true;
        deleteBtn.disabled = true;
        const originalText = saveBtn.textContent;
        saveBtn.textContent = 'Saving...';
        const updated = {
          ticker: tickerInput.value.trim().toUpperCase(),
          name: nameInput.value.trim(),
          units: parseFloat(unitsInput.value) || 0,
        };
        const { error } = await supabase
          .from('investment_holdings')
          .update(updated)
          .eq('id', holding.id);
        if (error) {
          note.textContent = 'Could not save — please try again.';
          note.classList.add('visible');
          saveBtn.disabled = false;
          deleteBtn.disabled = false;
          saveBtn.textContent = originalText;
          return;
        }
        editingIds.delete(holding.id);
        await loadHoldings();
      });

      // Same shared button style as Save -- Renewals deliberately does
      // NOT give Delete a separate "danger" color, just a different
      // label, and this mirrors that exactly rather than inventing a
      // red variant. Immediate delete on click, no confirmation dialog
      // -- same as Renewals' own Delete, not a stricter behavior
      // invented for this page.
      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.textContent = 'Delete';
      deleteBtn.addEventListener('mousedown', async () => {
        saveBtn.disabled = true;
        deleteBtn.disabled = true;
        const originalText = deleteBtn.textContent;
        deleteBtn.textContent = 'Deleting...';
        const { error } = await supabase
          .from('investment_holdings')
          .delete()
          .eq('id', holding.id);
        if (error) {
          note.textContent = 'Could not delete — please try again.';
          note.classList.add('visible');
          saveBtn.disabled = false;
          deleteBtn.disabled = false;
          deleteBtn.textContent = originalText;
          return;
        }
        editingIds.delete(holding.id);
        await loadHoldings();
      });

      // Starts empty and hidden -- only ever shown on a real save/
      // delete failure now. The static "Live ticker<->name lookup..."
      // info text this div used to always display was deleted entirely
      // per explicit request, 2026-09-01.
      const note = document.createElement('div');
      note.className = 'holding-edit-error';

      panel.append(
        tickerLabel, tickerInput,
        nameLabel, nameInput,
        unitsLabel, unitsInput,
        saveBtn, deleteBtn,
        note
      );
      card.append(panel);
    }

    function buildHoldingCard(holding) {
      const card = document.createElement('div');
      card.className = 'holding-card';

      if (editingIds.has(holding.id)) {
        buildEditView(card, holding);
      } else {
        // mousedown, not click -- mirrors Renewals' own
        // row.addEventListener('mousedown', openEdit) exactly, a real
        // gap found and closed 2026-09-01. The card sits outside
        // .add-wrapper, so the SAME document-level mousedown listener
        // that hides/reveals the "+" trigger also animates the
        // wrapper's own height (margin-bottom/max-height collapsing),
        // which shifts every card below it. A plain `click` here
        // requires mousedown and mouseup to land on the same point --
        // if that collapse moves this card between the two, the click
        // can silently fail to register, exactly the class of bug
        // already fixed once on Renewals' own row-open trigger.
        // mousedown resolves the whole action in one synchronous pass,
        // immune to that. Only attached when NOT already editing
        // (Renewals' equivalent listener is explicitly removed once
        // editing starts) -- this also removes the need for a
        // click-inside-the-panel stopPropagation guard, since there's
        // no "open" listener left on the card for a click inside the
        // panel to conflict with.
        card.addEventListener('mousedown', () => {
          editingIds.add(holding.id);
          renderHoldings();
        });
        buildDisplayView(card, holding);
      }
      return card;
    }

    loadHoldings();
  </script>
</body>
</html>
