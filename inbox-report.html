<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inbox Report — Masterboard</title>
<link rel="apple-touch-icon" href="/primelevel-masterboard/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* LOCKED OPENING PAGE -- approved by the owner 2026-09-26. The opening
     screens (no reports yet / could not load) follow the PrimeLevel
     opening-page standard exactly: title 50px bold gold and one message line
     20px regular soft grey-blue, 100px / 100px by eye, everything centred
     (since 2026-10-02 Sign out is the corner one every page shares, drawn by
     door.js). The values that produce it (.container padding-top, h1 margin,
     .empty-state) must NOT change without an explicit request from the
     owner. Full spec: OPENING-PAGE-STANDARD.md. Guarded automatically by
     tools/opening-page-check.mjs (workflow "Opening page guard"). */
  /* Same design tokens as the rest of Masterboard. PRIVATE PAGE: the reports
     contain email content, so they live in private Supabase tables, readable
     only by the allowed address (see email_report_viewers). There is no
     sign-in here: door.js sends anyone but the signed-in owner to the
     Masterboard front door (one door, owner 2026-10-02). */
  :root {
    --navy: #1E2633;
    --white: #F9F9FA;
    --gold: #B29B68;
    --input-bg: #2A3441;
    --placeholder: #8A93A3;
    --border: #3A4453;
    --red: #E45858; /* red TEXT on the dark navy (a failed report's date) */
    /* THE red on light backgrounds (owner, 2026-10-20): the High badge, the
       High card's stripe, "Worry: Yes" and the red warnings. #E45858 was too
       light for company-white text (3.4:1); this reads 5.3:1. */
    --red-on-light: #C62828;
    /* THE orange on light backgrounds (owner, 2026-10-20: "abandon the gold
       in those badge colours… gold only for branding"): the Medium badge,
       the Medium card's stripe and "Worry: Watch". Company-white text on it
       reads 4.8:1; the stripe against the grey card 4.2:1 (gold: 2.2). */
    --orange-on-light: #BC4C00;
    /* THE green on light backgrounds (owner, 2026-10-20: "the traffic
       system… one red, one orange, one green"): the Low badge, the Low card's
       stripe and "Worry: No". Company-white text on it reads 4.8:1; the
       stripe against the grey card 4.1:1 (the old pale grey: 1.1). */
    --green-on-light: #188038;
    /* THE grey on light backgrounds (owner, 2026-10-20: "one solid colour…
       solid grey, no fading"): the "Probably spam" badge and its card's
       stripe, the switched-off traffic light. Company-white text on it reads
       5.9:1; the stripe against the grey card 5.1:1 (the faded pale grey: 1.25). */
    --grey-on-light: #616161;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy);
    font-family: 'Montserrat', 'Montserrat Fallback', sans-serif;
    min-height: 100%;
  }
  .container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 87px 20px 100px; /* top: measured live -- 90px overshot to 103px by eye, 87px lands the "Inbox Report" letters exactly 100px from the page top */
  }
  h1 {
    color: var(--gold);
    font-weight: 700;
    font-size: 50px; /* owner 2026-09-28: sub-page titles 50px (the Masterboard home title stays 60px) */
    line-height: 65px; /* 50px letters are 8px shorter than 60px ones; a 65px line keeps exactly the space the 60px title had above and below its letters, so the locked 100/100/100 by eye is unchanged without touching any padding or margin */
    margin: 0 0 85px;
    text-align: center;
  }

  /* Date buttons: identical to Insider Edge's report tiles. Pinned to the
     left on wide screens, a centered row below 1728px. */
  .report-tiles {
    position: fixed;
    top: 48px;
    left: 40px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 200px;
  }
  .report-tile {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 50px;
    width: 200px;
    background: var(--input-bg);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 1px 18px 0; /* the 1px on top centres the text BY EYE (owner, 2026-10-02): capitals -> top edge = baseline -> bottom edge (was 18/19); phones (15px) were already 19.5/19.5 and keep 0 8px */
    color: var(--white);
    font-weight: 700;
    font-size: 18px;
    font-family: 'Montserrat', 'Montserrat Fallback', sans-serif;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .report-tile:hover,
  .report-tile:focus-visible, /* the Tab key: the mouse's look, no ring (owner, 2026-10-20) */
  .report-tile.selected {
    border-color: var(--white);
    transform: scale(1.025);
  }
  .report-tile:focus-visible { outline: none; }
  .report-tile.failed {
    color: var(--red);
  }
  /* Subtle gold glow for a report not opened yet (owner, 2026-10-14: "copy
     the exact same behaviour Insider Edge has"): COPIED from
     insider-edge.html's .report-tile.unread, the same value. Removed for
     good the first time that report's date is clicked (markReportRead()). */
  .report-tile.unread {
    box-shadow: 0 0 10px 2px rgba(178, 155, 104, 0.55);
    transition: border-color 0.15s ease, transform 0.1s ease, box-shadow 0.3s ease;
  }

  /* THE REPORT CARD = Insider Edge's LOCKED report card (owner, 2026-10-15:
     "the same colours, the same padding, the same size of the letters, fonts,
     everything"), written down once in REPORT-CARD-STANDARD.md and guarded on
     both pages (tools/inbox-spacing-check.mjs here). By eye: 100 around the
     band and above and below every heading, 30 between items, 24 between
     lines, 15 from a heading's letters to its line; inside the card on phones
     every 100 is 70. Same fonts and colours as Insider Edge. The Inbox
     Report's own badges keep their own colours; each email card is the
     sign-in box's white #E9E9EB (owner). A few numbers differ from Insider
     Edge's by 1-2px so the gaps LOOK the same: "Inbox" has no letter as tall
     as the dot of the i in "Insider" (26px against 28px at 35px), the same
     reason the page titles use 87 here and 90 there. */
  .report-content {
    width: 100%;
    background: var(--white);
    color: var(--navy);
    overflow: hidden;
  }
  .report-header-band {
    background: var(--input-bg);
    padding: 92px 70px 96px; /* card top -> title letters = 100 by eye; date line -> band bottom = 100 (Insider Edge: 94 / 96) */
    margin: 0 0 90px; /* band bottom -> "At a glance" letters = 100 by eye (Insider Edge: 91) */
    text-align: center;
  }
  .report-content-title {
    margin: 0 0 3px; /* title -> date line: the same as Insider Edge */
    font-weight: 700;
    font-size: 35px;
    color: var(--gold);
  }
  .report-content-date {
    color: var(--gold);
    opacity: 0.6;
    font-size: 15px;
    font-weight: 700;
  }
  .report-body {
    font-size: 15px;
    line-height: 1.6; /* 24px lines, as on Insider Edge; a 25px heading gets Insider Edge's 40px line, so its letters sit 15 above its line */
    padding: 0 70px 93px; /* last line of text -> card bottom = 100 by eye (Insider Edge's 93); a last email card adds 7 below */
    /* A word wider than the text column (a web address) breaks onto the next
       line instead of running under the card's edge: Insider Edge's rule. */
    overflow-wrap: anywhere;
  }
  .report-body h3 {
    font-size: 25px;
    font-weight: 700;
    margin: 83.5px 0 95px; /* letters above -> heading letters = 100 by eye (Insider Edge's 83.5); line -> letters below = 100 */
    padding-bottom: 4px;
    border-bottom: 2px solid var(--navy);
  }
  .report-body h3:first-child {
    margin-top: 0;
  }
  /* What sits under a heading starts with a BOX (an email card, or the
     summary line's badges) rather than letters: 5px more, so the line ->
     the box's edge is 100 by eye too. */
  .report-body h3 + ul:has(> li.entry),
  .report-body h3 + p:has(.badge) { padding-top: 5px; }
  /* A report that starts with a line of text instead of a heading (a failed
     run's message): band bottom -> its letters = 100 by eye (70 on phones). */
  .report-body > p:first-child { padding-top: 5px; }
  .report-body table.scan + h3 { margin-top: 90.5px; } /* the table's last line -> heading letters = 100 by eye */
  .report-body ul:has(> li.entry) + h3 { margin-top: 90px; } /* the last card's edge -> heading letters = 100 by eye */
  .report-body p {
    margin: 0 0 18px; /* paragraph -> paragraph = 30 by eye (Insider Edge's check lines: 18) */
  }
  .report-body > *:last-child {
    margin-bottom: 0;
  }
  .report-body > ul:last-child:has(> li.entry) {
    margin-bottom: 7px; /* the last email card's edge -> card bottom = 100 by eye (93 + 7) */
  }
  .report-body ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .report-body li {
    margin: 0 0 18px; /* a plain list (the Notebook): item -> item = 30 by eye */
    padding: 0;
  }
  .report-body li:last-child {
    margin-bottom: 0;
  }
  .report-body ul ul {
    margin: 6px 0 0 20px;
  }
  .report-body ul ul li {
    margin-bottom: 6px;
  }
  /* ---- Scannable layout: at-a-glance table + one card per email ---- */
  .badge {
    display: inline-block;
    padding: 2px 10px;
    margin: 0 4px 4px 0;
    border: 1px solid transparent;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    line-height: 20px;
    white-space: nowrap;
  }
  /* ONE white (owner, 2026-10-20): every white in a badge is company white. */
  .badge.high { background: var(--red-on-light); color: var(--white); }
  .badge.medium { background: var(--orange-on-light); color: var(--white); }
  .badge.low { background: var(--green-on-light); color: var(--white); }
  .badge.spam { background: var(--grey-on-light); color: var(--white); }
  .badge.worry-yes { background: var(--white); color: var(--red-on-light); border-color: var(--red-on-light); }
  .badge.worry-watch { background: var(--white); color: var(--orange-on-light); border-color: var(--orange-on-light); }
  .badge.worry-no { background: var(--white); color: var(--green-on-light); border-color: var(--green-on-light); }
  /* The Who and Draft badges use ONLY company navy and company white (owner,
     2026-10-20): Who = navy fill, white words; Draft = white fill, navy words
     and outline. */
  .badge.cat { background: var(--navy); color: var(--white); }
  .badge.draft { background: var(--white); color: var(--navy); border-color: var(--navy); }
  /* The agent's red warnings ("Handle personally, review carefully",
     "Possible fake invoice…") arrive as color:#E45858: shown in THE red. */
  .report-body [style*="E45858" i] { color: var(--red-on-light) !important; }
  /* An email card's urgency badge says what it is, like its "Worry: Yes"
     next to it (owner, 2026-10-19): "Urgency: High". Every screen; the agent
     writes only the word. "Probably spam" names itself. */
  .report-body li.entry p.head .badge:is(.high, .medium, .low)::before { content: 'Urgency: '; }
  .report-body table.scan {
    width: 100%;
    margin: 0;
    border-collapse: collapse;
    font-size: 15px; /* Insider Edge's one text size (was 14) */
    line-height: 24px;
    /* break-word, not the report's "anywhere": a long word still wraps, but a
       column can no longer be squeezed narrower than its own words (17 Oct
       2026: with only a short "High" badge in the first column, the heading
       broke into "Urgenc / y"). */
    overflow-wrap: break-word;
  }
  .report-body table.scan th {
    padding: 0 10px 8px; /* no top padding: the paragraph above -> heading letters = 30 by eye */
    text-align: left;
    font-size: 15px; /* was 13 */
    border-bottom: 2px solid var(--navy);
  }
  .report-body table.scan td {
    padding: 10px;
    vertical-align: top;
    border-bottom: 1px solid var(--navy); /* row line: thin company navy, half the titles' 2px (owner, 2026-10-20: no grey) */
  }
  /* "No reply needed" stays on one line in the Draft column (at 15px it
     wrapped); the long "From — what it is" column wraps instead. Phones
     stack the table, so this is for wider screens only. */
  @media (min-width: 721px) {
    .report-body table.scan th:nth-child(4),
    .report-body table.scan td:nth-child(4) { white-space: nowrap; }
  }
  /* One email = one card. 30 by eye everywhere: card -> next card, the card's
     edge -> its first and last line, and between its parts (Insider Edge's
     gap between items). Background: the sign-in box's white (owner,
     2026-10-15: "the same shade of white we use in the sign-in box", not a
     new colour; SIGNIN-BOX-STANDARD.md). No outline (owner, 2026-10-20): the
     grey fill, the urgency stripe and the 30 gap already mark each card; the
     1px the pale-grey outline took is in the padding, so nothing moved. */
  .report-body li.entry {
    margin: 0 0 30px;
    padding: 30px 19px 23px 18px;
    border-left: 6px solid var(--grey-on-light); /* a card without an urgency: the solid grey */
    border-radius: 10px;
    background: #E9E9EB;
  }
  .report-body li.entry:last-child { margin-bottom: 0; }
  .report-body li.entry.high { border-left-color: var(--red-on-light); }
  .report-body li.entry.medium { border-left-color: var(--orange-on-light); }
  .report-body li.entry.low { border-left-color: var(--green-on-light); }
  .report-body li.entry.spam { border-left-color: var(--grey-on-light); } /* solid, never faded (owner, 2026-10-20) */
  .report-body li.entry p { margin: 0 0 18px; }
  .report-body li.entry p.head { margin-bottom: 21px; } /* the badges' own 4px below + 21 = 30 by eye to the from line */
  .report-body li.entry p.from { font-size: 15px; color: #4b5565; }
  .report-body li.entry p.gist { font-size: 15px; }
  .report-body li.entry p.why { font-size: 15px; }
  .report-body details {
    margin: 0 0 18px;
  }
  .report-body li.entry > *:last-child { margin-bottom: 0; }
  .report-body summary {
    width: fit-content; /* the ▶ and the words only, like "Open the email": it pops, and clicks, only there (owner, 2026-10-20: not 5-6 cm away on the same line) */
    cursor: pointer;
    font-weight: 700;
  }

  /* Quoted text: the original email and the drafted reply. The white box
     alone marks it: no gold line on its left (owner, 2026-10-20: "the white
     box tells the story on its own"; on a Medium card the gold line looked
     like the card's gold urgency stripe). Text 18 from both sides. */
  .report-body blockquote {
    margin: 23px 0 25px; /* the line above -> box edge = 30 by eye; box edge -> the line below = 30 */
    padding: 12px 18px;
    background: var(--white); /* company white, so the email and the draft stand out from the grey card (owner, 2026-10-16; was navy at 6%) */
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .report-body a {
    display: inline-block; /* an inline link can't grow; this one can (a word or two, never wraps) */
    color: var(--navy);
    font-weight: 700;
    text-decoration: underline;
  }
  /* The card's clickable lines ("Read the draft reply", every email link) pop
     like Sign out and the back arrow (door.js, copied: 1.05 only where a real
     pointer hovers, 0.97 on a press, 0.15s, no animation if the device asks
     for less motion), anchored on the left so the words stay in line with the
     text above. The Tab key gets the same pop instead of a ring (owner,
     2026-10-20: "no rings at all"); last, so it holds even with less motion
     (then without the animation): a keyboard user always sees where they are. */
  .report-body summary,
  .report-body a { transition: transform 0.15s ease; transform-origin: left center; }
  @media (hover: hover) { .report-body summary:hover, .report-body a:hover { transform: scale(1.05); } }
  .report-body summary:active,
  .report-body a:active { transform: scale(0.97); }
  @media (prefers-reduced-motion: reduce) {
    .report-body summary, .report-body a { transition: none; }
    .report-body summary:hover, .report-body a:hover, .report-body summary:active, .report-body a:active { transform: none; }
  }
  .report-body summary:focus-visible,
  .report-body a:focus-visible { outline: none; transform: scale(1.05); }
  .report-error {
    color: #b33a3a;
    font-weight: 700;
  }
  /* PRIMELEVEL OPENING-PAGE STANDARD (owner, 2026-09-26) -- identical to
     insider-edge.html's "Click a date to open a report." screen: title
     Montserrat 50px bold gold (60 -> 50 by the owner, 2026-09-28); ONE message line Montserrat 20px regular soft
     grey-blue (--placeholder); page top -> title letters and title ->
     message letters 100px by eye; everything centred. EVERY message here (no
     reports yet, could not load) uses this one style -- no per-message
     colours or weights. Spec: OPENING-PAGE-STANDARD.md. */
  .empty-state {
    color: var(--placeholder);
    font-size: 20px;
    font-weight: 400;
    text-align: center;
    padding: 0 0 60px;
    width: 100%;
  }

  /* The message is 100px by eye below the title at EVERY width (owner,
     2026-10-01: "100 everywhere"): the -4px makes up for the 20px letters
     starting ~4px down their line. Messages only ever show when there are no
     date buttons, so the empty button row takes no space (:empty below). */
  .empty-state { margin-top: -4px; }
  @media (max-width: 1727px) {
    .report-tiles {
      position: static;
      width: auto;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      margin: 0 0 40px;
      padding-top: 1px; /* title letters -> button EDGE: 99 -> 100 by eye (padding, not margin: a margin would collapse into the title's) */
    }
    .report-tiles:empty { margin: 0; padding: 0; }
    /* The closed screen (a report closed by a click outside, 2026-10-14):
       the message sits under the date buttons exactly as on Insider Edge
       (no -4px there: buttons -> message letters 44 by eye on both pages). */
    .report-tiles:not(:empty) + #content .closed-state { margin-top: 0; }
    h1 { margin-bottom: 85px; } /* title letters -> top EDGE of the date buttons = 100 by eye (was 40 = 48 by eye) */
  }
  @media (max-width: 720px) {
    .container { padding-top: 90px; } /* 44px title: page top -> letters 100 by eye */
    h1 { font-size: 44px; line-height: normal; margin-bottom: 89px; } /* phone title unchanged by the 50px desktop change; margin: title -> next = 100 by eye */
    .report-tile {
      width: calc(50% - 8px);
      padding: 0 8px;
      font-size: 15px;
    }
    /* PHONES: ONE 70 RHYTHM INSIDE THE REPORT CARD, as on Insider Edge
       (owner, 2026-10-05): every 100 by eye above is 70 here; 30 / 24 / 15
       stay. Insider Edge's phone numbers: band 66 / 66 + 61, body 63,
       headings 53.5 / 61. */
    .report-header-band { padding: 65px 24px 66px; margin-bottom: 60px; }
    .report-content-title { font-size: 26px; }
    .report-body { padding: 0 24px 63px; }
    .report-body h3 { margin: 53.5px 0 65px; }
    .report-body table.scan + h3 { margin-top: 61px; }
    .report-body ul:has(> li.entry) + h3 { margin-top: 60px; }
    /* Phones: each summary row becomes a compact stacked line (badges, then the
       sentence, then the draft status) instead of a cramped 4-column table. */
    .report-body table.scan,
    .report-body table.scan tbody { display: block; }
    .report-body table.scan thead { display: none; }
    .report-body table.scan tr {
      display: block;
      padding: 10px 0;
      border-bottom: 1px solid var(--navy); /* the same thin navy row line */
    }
    .report-body table.scan tr:first-child { padding-top: 5px; } /* the paragraph above -> the first row's badges = 30 by eye */
    .report-body table.scan td {
      display: inline-block;
      padding: 0 6px 4px 0;
      border: 0;
    }
    .report-body table.scan td:nth-child(3) {
      display: block;
      padding: 2px 0 4px;
    }
    .report-body table.scan td:nth-child(4)::before {
      content: 'Draft: ';
      color: #4b5565;
    }
    /* The titles row is hidden here, so the two badges carry their column's
       title too, as "Draft: " does (owner, 2026-10-18): "Urgency: High",
       "Worry: Yes". "Probably spam" names itself. The two share one line
       when it is wide enough; a pair too long for a narrow phone's line
       (e.g. "Urgency: Medium" + "Worry: Watch" at 375 or less) stacks,
       Worry under Urgency (owner's choice). */
    .report-body table.scan td:nth-child(1) .badge:is(.high, .medium, .low)::before { content: 'Urgency: '; }
    .report-body table.scan td:nth-child(2) .badge::before { content: 'Worry: '; }
  }
  @media (max-width: 359px) {
    .container { padding-top: 91px; } /* 38px title: page top -> letters 100 by eye */
    h1 { font-size: 38px; margin-bottom: 90px; }
  }
</style>

<body>
  <div class="container pl-private">
    <h1>Inbox Report</h1>
    <div class="report-tiles" id="reportTiles"></div>
    <div id="content"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.2?bundle';
    import DOMPurify from 'https://esm.sh/dompurify@3.1.6';

    const SUPABASE_URL = 'https://kenlhcatkjthhzuaznpg.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_-gt5PPGL45s3hRsfOosH6g_q3yP-b-_';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const tilesEl = document.getElementById('reportTiles');
    const contentEl = document.getElementById('content');

    // ---- Sanitising ---------------------------------------------------
    // The report text is written by an AI agent FROM EMAIL CONTENT, which
    // anyone in the world can influence. So it is never trusted: only a few
    // plain tags survive, links are limited to opening a Gmail thread, and
    // inline style may only set a text colour (the red flags).
    const GMAIL_LINK = /^https:\/\/mail\.google\.com\//;
    const COLOUR_ONLY = /^\s*color:\s*#[0-9a-f]{3,8}\s*;?\s*$/i;
    // Only these style classes are honoured (defined in this page's CSS).
    const CLASS_WHITELIST = new Set(['badge', 'high', 'medium', 'low', 'spam', 'worry-yes', 'worry-watch', 'worry-no', 'cat', 'draft', 'entry', 'head', 'from', 'gist', 'why', 'scan']);
    DOMPurify.addHook('afterSanitizeAttributes', (node) => {
      if (node.hasAttribute('class')) {
        const kept = node.getAttribute('class').split(/\s+/).filter((c) => CLASS_WHITELIST.has(c));
        if (kept.length) node.setAttribute('class', kept.join(' '));
        else node.removeAttribute('class');
      }
      if (node.hasAttribute('style') && !COLOUR_ONLY.test(node.getAttribute('style'))) {
        node.removeAttribute('style');
      }
      if (node.tagName === 'A') {
        if (!GMAIL_LINK.test(node.getAttribute('href') || '')) {
          node.removeAttribute('href');
        } else {
          node.setAttribute('target', '_blank');
          node.setAttribute('rel', 'noopener noreferrer');
        }
      }
    });
    function cleanReportHtml(html) {
      return DOMPurify.sanitize(html || '', {
        ALLOWED_TAGS: ['h3', 'h4', 'p', 'ul', 'ol', 'li', 'blockquote', 'strong', 'em', 'b', 'i', 'br', 'span', 'a', 'table', 'thead', 'tbody', 'tr', 'th', 'td', 'details', 'summary'],
        ALLOWED_ATTR: ['style', 'href', 'target', 'rel', 'class', 'open'],
      });
    }

    // ---- Small helpers --------------------------------------------------
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    // Every date: three-letter month, "28 Sep 2026" (owner rule, 2026-10-01).
    // Spelled out here: the browser's own short month writes September as
    // "Sept" (British) or puts the month first (American).
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function toDate(value) {
      // A plain "2026-09-28" (run_date) is a calendar day, not a moment:
      // read it as local, so no timezone can shift it to the day before.
      const day = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
      return day ? new Date(+day[1], +day[2] - 1, +day[3]) : new Date(value);
    }
    function formatDate(value) {
      const d = toDate(value);
      return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    }

    // ---- Signed-in view -------------------------------------------------
    function renderReport(report) {
      const card = el('div', 'report-content');
      const band = el('div', 'report-header-band');
      band.append(el('div', 'report-content-title', report.title));
      // The day the report was made, written like Insider Edge's band
      // ("13 Oct 2026"; owner, 2026-10-15: the banner "written the same way").
      band.append(el('div', 'report-content-date', formatDate(report.created_at)));
      const body = el('div', 'report-body');
      if (report.status === 'failed') {
        body.append(el('p', 'report-error', 'This run failed, so there is no report for this day.'));
        body.append(el('p', '', report.error_text || 'No error details were recorded.'));
      } else {
        body.innerHTML = cleanReportHtml(report.html_content);
      }
      card.append(band, body);
      contentEl.replaceChildren(card);
      alignTiles();
    }

    // The tiles are position:fixed on wide screens, so put them on the same
    // line as the top of the report card (scroll-independent).
    function alignTiles() {
      if (getComputedStyle(tilesEl).position !== 'fixed') return;
      const target = contentEl.firstElementChild;
      if (!target) return;
      tilesEl.style.top = `${Math.round(target.getBoundingClientRect().top + window.scrollY)}px`;
    }
    window.addEventListener('resize', alignTiles);

    // The reports on screen, and the one that is open (null = closed).
    let shownReports = [];
    let openId = null;

    // A NEW REPORT GLOWS until its date is clicked (owner, 2026-10-14: "copy
    // the exact same behaviour Insider Edge has and mirror it"): COPIED from
    // insider-edge.html (getReadReportIds / markReportRead), with this page's
    // own key. Kept in this browser's storage, so it survives closing the
    // tab; only a click on that report's date marks it read. The Masterboard
    // home reads the same key for its own glow (checkInboxReportUnread).
    const READ_REPORTS_KEY = 'inbox-report-read-reports-v1';
    function getReadReportIds() {
      try {
        return new Set(JSON.parse(localStorage.getItem(READ_REPORTS_KEY) || '[]'));
      } catch {
        return new Set(); // harmless -- glow just won't persist correctly across visits
      }
    }
    function markReportRead(id) {
      try {
        const readIds = getReadReportIds();
        if (readIds.has(id)) return; // already marked -- skip the write
        readIds.add(id);
        localStorage.setItem(READ_REPORTS_KEY, JSON.stringify([...readIds]));
      } catch {
        // Harmless if storage is unavailable -- unread glow just won't persist across visits.
      }
    }

    function renderTiles(reports, selectedId) {
      tilesEl.replaceChildren();
      const readIds = getReadReportIds();
      for (const report of reports) {
        const tile = el('button', 'report-tile', formatDate(report.run_date || report.created_at));
        tile.type = 'button';
        if (report.status === 'failed') tile.classList.add('failed');
        if (!readIds.has(report.id)) tile.classList.add('unread');
        if (report.id === selectedId) tile.classList.add('selected');
        tile.addEventListener('click', () => {
          openId = report.id;
          markReportRead(report.id); // an explicit click, and only this, clears the glow (as on Insider Edge)
          renderTiles(reports, report.id);
          renderReport(report);
        });
        tilesEl.append(tile);
      }
    }

    // THE CLOSED SCREEN (Insider Edge's): the date buttons, none highlighted,
    // and "Click a date to open a report." in the opening-page message style.
    // Shown on arrival (owner, 2026-10-14: "exactly the same as Insider Edge
    // on behaviour": nothing opens until a date is clicked) and after a
    // report is closed.
    function showClosed() {
      openId = null;
      renderTiles(shownReports, null);
      contentEl.replaceChildren(el('div', 'empty-state closed-state', 'Click a date to open a report.'));
      alignTiles();
    }

    // CLICK OUTSIDE CLOSES (owner, 2026-10-14: "the same mechanism as Insider
    // Edge"), copied from insider-edge.html: a left click anywhere outside
    // the white report card (and not on a date button, whose job is to OPEN
    // a report) closes the open report; a click inside it does nothing.
    document.addEventListener('click', (e) => {
      if (openId === null) return;
      if (e.target.closest('.report-content') || e.target.closest('.report-tile')) return;
      showClosed();
    });

    // A FINGER TAP OUTSIDE CLOSES IT TOO (owner, 2026-10-14: "tap outside
    // closes on phones, on both report pages, using the same proven tap rule
    // as the cards"). An iPhone sends no click for a tap on plain text or
    // empty space, so the click rule above never fired on his phone. COPIED
    // from the cards (investments.html, "A PRESS" + "A FIRM OR QUICK TAP"):
    // a finger on plain space that lifts having moved under 20px, with the
    // page scrolled under 8px, is a tap (scrolling never closes anything),
    // and that tap's late mouse press is cancelled (closing moves the page
    // under the finger). Things that take presses (the date buttons, links,
    // Sign out, the arrow) keep their own job; a tap inside the report does
    // nothing. Identical on insider-edge.html.
    function takesPresses(el) {
      for (let n = el; n && n.nodeType === 1 && n !== document.body; n = n.parentElement) {
        if (n.matches('a[href], button, input, select, textarea, label') || getComputedStyle(n).cursor === 'pointer') return true;
      }
      return false;
    }
    let plainFinger = null, fingerFrom = null; // the plain spot a finger went down on, and where
    document.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'touch' || !e.isPrimary) return;
      plainFinger = takesPresses(e.target) || e.target.closest('.report-content') ? null : e.target;
      fingerFrom = { x: e.clientX, y: e.clientY, sx: window.scrollX, sy: window.scrollY };
    }, true);
    document.addEventListener('touchend', (e) => {
      const target = plainFinger, from = fingerFrom;
      plainFinger = null; fingerFrom = null;
      if (!target || !from || e.touches.length) return; // not plain space outside the report, or another finger still down
      if (openId === null) return; // nothing open
      const lift = e.changedTouches[0];
      const moved = Math.hypot(lift.clientX - from.x, lift.clientY - from.y);
      const scrolled = Math.max(Math.abs(window.scrollY - from.sy), Math.abs(window.scrollX - from.sx));
      if (moved >= 20 || scrolled >= 8) return; // a real swipe or scroll: nothing closes
      if (e.cancelable) e.preventDefault(); // no late mouse press (see above)
      showClosed();
    }, { capture: true, passive: false });

    // Only ever runs for the signed-in owner (door.js checked the database's
    // own allow-list first; anyone else was sent to the Masterboard front
    // door, which signs that account out and says it has no access).
    async function showReports() {
      contentEl.replaceChildren();
      tilesEl.replaceChildren();
      const { data, error } = await supabase
        .from('email_reports')
        .select('id, created_at, run_date, status, title, html_content, error_text')
        .order('created_at', { ascending: false })
        .limit(30);
      if (error) {
        // A clean, plain-English message for the reader -- the real
        // technical detail (table/column names, the raw Postgres error) is
        // still logged to the console for whoever is debugging, never
        // shown on the page.
        console.error('Could not load email_reports:', error);
        contentEl.append(el('div', 'empty-state', 'Could not load your reports right now. Please try again in a moment.'));
      } else if (!data.length) {
        contentEl.append(el('div', 'empty-state', 'No reports to show yet. The first one appears after the agent’s 08:00 run.'));
      } else {
        shownReports = data;
        showClosed(); // nothing opens on arrival, as on Insider Edge
      }
    }

    // ---- One front door (owner, 2026-10-02) ----
    // No sign-in here: door.js sends anyone but the signed-in owner to the
    // Masterboard front door and draws the corner Sign out. The reports load
    // only for the owner (at once when door.js already knew the owner).
    PrimeLevelDoor.whenOwner(showReports);
    PrimeLevelDoor.gate(supabase);
  </script>
</body>
</html>
